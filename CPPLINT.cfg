set noparent


filter=-whitespace/line_length,-whitespace/comments,-whitespace/braces

# blank lines after complex if statements help readability
filter=-whitespace/blank_line

filter=-readability/todo

# have no need for explicit folder names in includes
filter=-build/include

# doesn't seem to be able to handle our 'MUDLET_' prefix
filter=-build/header_guard

# clang-format (AccessModifierOffset: -4) puts public:/private:/signals: in column 0, which cpplint
# wants indented +1; also covers whitespace/indent_namespace, whose hits are clang-format continuation indents
filter=-whitespace/indent

# Mudlet is C++20, so <filesystem> is fine
filter=-build/c++17

# `using namespace std::chrono_literals;` brings in the ms/s suffixes, but cpplint's \bliterals\b exemption
# misses it; filters match by prefix, so turn the two narrower namespace checks back on
filter=-build/namespaces,+build/namespaces_literals,+build/namespaces_headers

id: org.mudlet.mudlet
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: mudlet
rename-desktop-file: mudlet.desktop
rename-icon: mudlet
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  - --filesystem=home

cleanup:
  - /bin/json_reformat
  - /bin/json_verify

modules:
  - name: lua-5.1
    buildsystem: simple
    build-commands:
      - make -j $FLATPAK_BUILDER_N_JOBS CFLAGS="$CFLAGS -fPIC -DLUA_USE_LINUX" linux
      - make INSTALL_TOP=$FLATPAK_DEST TO_LIB='liblua.a liblua.so.5.1.5' install
      - ln -sf liblua.so.5.1.5 $FLATPAK_DEST/lib/liblua.so
      - ln -sf liblua.so.5.1.5 $FLATPAK_DEST/lib/liblua.so.5.1
      - install -Dm0644 etc/lua.pc $FLATPAK_DEST/lib/pkgconfig/lua.pc
      - ln -sf lua.pc $FLATPAK_DEST/lib/pkgconfig/lua51.pc
      - ln -sf lua.pc $FLATPAK_DEST/lib/pkgconfig/lua5.1.pc
      - ln -sf lua.pc $FLATPAK_DEST/lib/pkgconfig/lua-5.1.pc
    sources:
      - type: archive
        url: 'https://www.lua.org/ftp/lua-5.1.5.tar.gz'
        sha256: 2640fc56a795f29d28ef15e13c34a47e223960b0240e8cb0a82d9b0738695333
      - type: patch
        path: lua-5.1.5-so.patch
      - type: shell
        commands:
          - sed -i "s|/usr/local|$FLATPAK_DEST|" etc/lua.pc src/luaconf.h
    cleanup:
      - '*.a'
      - /bin
      - /include
      - /lib/pkgconfig
      - /man

  - name: libsecret
    buildsystem: meson
    config-opts:
      - -Dmanpage=false
      - -Dvapi=false
      - -Dgtk_doc=false
      - -Dintrospection=false
      # https://gitlab.gnome.org/GNOME/libsecret/-/issues/49
      - -Dgcrypt=false
    sources:
      - commit: 0936f740c02b60f02657729cd99f581db4517a41
        tag: 0.21.7
        type: git
        url: https://gitlab.gnome.org/GNOME/libsecret.git
    cleanup:
      - /bin/secret-tool

  - name: libzip
    buildsystem: cmake-ninja
    config-opts:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
    cleanup:
    - "/include"
    - "/bin"
    - "/share"
    - "/lib/pkgconfig"
    - "/lib/*.la"
    sources:
    - type: archive
      url: https://libzip.org/download/libzip-1.11.4.tar.xz
      sha256: 8a247f57d1e3e6f6d11413b12a6f28a9d388de110adc0ec608d893180ed7097b

  - name: pugixml
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_SHARED_LIBS=on .
    sources:
      - type: archive
        url: https://github.com/zeux/pugixml/releases/download/v1.15/pugixml-1.15.tar.gz
        sha256: 655ade57fa703fb421c2eb9a0113b5064bddb145d415dd1f88c79353d90d511a

  - name: yajl
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - '-DCMAKE_BUILD_TYPE=Release'
    sources:
      - type: archive
        url: 'https://github.com/lloyd/yajl/archive/refs/tags/2.1.0.tar.gz'
        sha256: 3fb73364a5a30efe615046d07e6db9d09fd2b41c763c5f7d3bfb121cd5c5ac5a

  - name: luarocks
    buildsystem: simple
    build-commands:
      - >-
        ./configure --with-lua=/app --prefix=/app
        --with-lua-include=/app/include --force-config
      - make build
      - make install
    build-options:
      strip: false
      no-debuginfo: true
      no-debuginfo-compression: true
    sources:
      - type: archive
        url: 'https://github.com/luarocks/luarocks/archive/refs/tags/v3.12.2.tar.gz'
        sha256: 9c25fa7ab5017d60b25137ab1a4cb76e3185df1fe02df1f577f57d1a6b548a2a
    cleanup:
      - /bin/luarocks*
      - /share/luarocks
      - /etc/luarocks*

  - name: sqlite3
    config-opts:
      - CFLAGS=-O2 -DSQLITE_ENABLE_FTS4 -DSQLITE_ENABLE_RTREE
    sources:
      - type: archive
        url: 'https://www.sqlite.org/2025/sqlite-autoconf-3510200.tar.gz'
        sha256: 2515deb547c6391e020559d320b375e15f8cfef116f3550ffea8ef25f0807a58
    cleanup:
      - /bin/sqlite3

  - name: pcre8
    config-opts:
      - "--enable-utf"
      - "--enable-unicode-properties"
      - "--prefix=/app"
    sources:
      - type: archive
        url: 'https://sourceforge.net/projects/pcre/files/pcre/8.45/pcre-8.45.tar.bz2'
        sha256: 4dae6fdcd2bb0bb6c37b5f97c33c2be954da743985369cddac3546e3218bffb8
    cleanup:
    - /bin/pcre-config
    - /bin/pcregrep
    - /bin/pcretest

  - name: boost
    buildsystem: 'simple'
    build-commands:
      # we don't need to build boost, only using it for headers
      - cp -r * /app/include
    sources:
      - type: archive
        url: 'https://archives.boost.io/release/1.90.0/source/boost_1_90_0.tar.bz2'
        sha256: 49551aff3b22cbc5c5a9ed3dbc92f0e23ea50a0f7325b0d198b705e8ee3fc305

  - name: luarucks-mods
    buildsystem: simple
    build-options:
      build-args:
        - '--share=network'
    build-commands:
      - luarocks install --tree="/app" lua-yajl YAJL_INCDIR="/app/include" YAJL_LIBDIR="/app/lib" LUA_INCDIR="/app/include"
      - luarocks install --tree="/app" luautf8
      - luarocks install --tree="/app" LuaFileSystem
      - luarocks install --tree="/app" lua-zip ZIP_INCDIR="/app/include" ZIP_LIBDIR="/app/lib" LUA_INCDIR="/app/include"
      - luarocks install --tree="/app" LuaSQL-SQLite3 SQLITE_INCDIR="/app/include"
      - luarocks install --tree="/app" lrexlib-pcre PCRE_INCDIR="/app/include" PCRE_LIBDIR="/app/lib"

  - name: glu
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://ftp.osuosl.org/pub/blfs/conglomeration/glu/glu-9.0.2.tar.xz
        sha256: 6e7280ff585c6a1d9dfcdf2fca489251634b3377bfc33c29e4002466a38d02d4
    cleanup:
      - /include
      - /lib/*.a
      - /lib/*.la
      - /lib/pkgconfig

  - name: mudlet
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    sources:
      - type: dir
        path: ../

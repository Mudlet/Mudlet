id: org.mudlet.mudlet
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: mudlet
rename-desktop-file: mudlet.desktop
rename-icon: mudlet
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  - --filesystem=home

cleanup:
  - /bin/json_reformat
  - /bin/json_verify

modules:
  - name: lua-5.1
    buildsystem: simple
    build-commands:
      - make -j $FLATPAK_BUILDER_N_JOBS CFLAGS="$CFLAGS -fPIC -DLUA_USE_LINUX" linux
      - make INSTALL_TOP=$FLATPAK_DEST TO_LIB='liblua.a liblua.so.5.1.5' install
      - ln -sf liblua.so.5.1.5 $FLATPAK_DEST/lib/liblua.so
      - ln -sf liblua.so.5.1.5 $FLATPAK_DEST/lib/liblua.so.5.1
      - install -Dm0644 etc/lua.pc $FLATPAK_DEST/lib/pkgconfig/lua.pc
      - ln -sf lua.pc $FLATPAK_DEST/lib/pkgconfig/lua51.pc
      - ln -sf lua.pc $FLATPAK_DEST/lib/pkgconfig/lua5.1.pc
      - ln -sf lua.pc $FLATPAK_DEST/lib/pkgconfig/lua-5.1.pc
    sources:
      - type: archive
        url: 'https://www.lua.org/ftp/lua-5.1.5.tar.gz'
        sha256: 2640fc56a795f29d28ef15e13c34a47e223960b0240e8cb0a82d9b0738695333
      - type: patch
        path: lua-5.1.5-so.patch
      - type: shell
        commands:
          - sed -i "s|/usr/local|$FLATPAK_DEST|" etc/lua.pc src/luaconf.h
    cleanup:
      - '*.a'
      - /bin
      - /include
      - /lib/pkgconfig
      - /man

  - name: libsecret
    buildsystem: meson
    config-opts:
      - -Dmanpage=false
      - -Dvapi=false
      - -Dgtk_doc=false
      - -Dintrospection=false
      - -Dcrypto=disabled
    sources:
      - commit: 0936f740c02b60f02657729cd99f581db4517a41
        tag: 0.21.7
        type: git
        url: https://gitlab.gnome.org/GNOME/libsecret.git
    cleanup:
      - /bin/secret-tool

  - name: libzip
    buildsystem: cmake-ninja
    config-opts:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
    cleanup:
    - "/include"
    - "/bin"
    - "/share"
    - "/lib/pkgconfig"
    - "/lib/*.la"
    sources:
    - type: archive
      url: https://libzip.org/download/libzip-1.11.4.tar.xz
      sha256: 8a247f57d1e3e6f6d11413b12a6f28a9d388de110adc0ec608d893180ed7097b

  - name: pugixml
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_SHARED_LIBS=on .
    sources:
      - type: archive
        url: https://github.com/zeux/pugixml/releases/download/v1.15/pugixml-1.15.tar.gz
        sha256: 655ade57fa703fb421c2eb9a0113b5064bddb145d415dd1f88c79353d90d511a

  - name: yajl
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - '-DCMAKE_BUILD_TYPE=Release'
    sources:
      - type: archive
        url: 'https://github.com/lloyd/yajl/archive/refs/tags/2.1.0.tar.gz'
        sha256: 3fb73364a5a30efe615046d07e6db9d09fd2b41c763c5f7d3bfb121cd5c5ac5a

  - name: luarocks
    buildsystem: simple
    build-commands:
      - >-
        ./configure --with-lua=/app --prefix=/app
        --with-lua-include=/app/include --force-config
      - make build
      - make install
    build-options:
      strip: false
      no-debuginfo: true
      no-debuginfo-compression: true
    sources:
      - type: archive
        url: 'https://github.com/luarocks/luarocks/archive/refs/tags/v3.12.2.tar.gz'
        sha256: 9c25fa7ab5017d60b25137ab1a4cb76e3185df1fe02df1f577f57d1a6b548a2a
    cleanup:
      - /bin/luarocks*
      - /share/luarocks
      - /etc/luarocks*

  - name: sqlite3
    config-opts:
      - CFLAGS=-O2 -DSQLITE_ENABLE_FTS4 -DSQLITE_ENABLE_RTREE
    sources:
      - type: archive
        url: 'https://sqlite.org/2026/sqlite-autoconf-3510200.tar.gz'
        sha256: fbd89f866b1403bb66a143065440089dd76100f2238314d92274a082d4f2b7bb
    cleanup:
      - /bin/sqlite3

  - name: pcre8
    config-opts:
      - "--enable-utf"
      - "--enable-unicode-properties"
      - "--prefix=/app"
    sources:
      - type: archive
        url: 'https://sourceforge.net/projects/pcre/files/pcre/8.45/pcre-8.45.tar.bz2'
        sha256: 4dae6fdcd2bb0bb6c37b5f97c33c2be954da743985369cddac3546e3218bffb8
    cleanup:
    - /bin/pcre-config
    - /bin/pcregrep
    - /bin/pcretest

  - name: boost
    buildsystem: 'simple'
    build-commands:
      # we don't need to build boost, only using it for headers
      - cp -r * /app/include
    sources:
      - type: archive
        url: 'https://archives.boost.io/release/1.90.0/source/boost_1_90_0.tar.bz2'
        sha256: 49551aff3b22cbc5c5a9ed3dbc92f0e23ea50a0f7325b0d198b705e8ee3fc305

  - name: lua-yajl
    buildsystem: simple
    build-commands:
      - luarocks install --tree="/app" lua-yajl-2.0-1.src.rock YAJL_INCDIR="/app/include" YAJL_LIBDIR="/app/lib" LUA_INCDIR="/app/include"
    sources:
      - type: file
        url: 'https://luarocks.org/manifests/brimworks/lua-yajl-2.0-1.src.rock'
        sha256: 8e5c5bde4ae4aac336c5ce6da2aef94bf4f69f37e921d718647914bd5328552f

  - name: luautf8
    buildsystem: simple
    build-commands:
      - luarocks install --tree="/app" luautf8-0.2.0-1.src.rock
    sources:
      - type: file
        url: 'https://luarocks.org/manifests/xavier-wang/luautf8-0.2.0-1.src.rock'
        sha256: 36d930b3548d4b1bd87aa607e68b9aca08e23aa27309c34100e3b114d0f45b09

  - name: luafilesystem
    buildsystem: simple
    build-commands:
      - luarocks install --tree="/app" luafilesystem-1.9.0-1.src.rock
    sources:
      - type: file
        url: 'https://luarocks.org/manifests/hisham/luafilesystem-1.9.0-1.src.rock'
        sha256: 3de68d619f6ad95a27f4728814375447d921305194b7050dee6199057c31282f

  - name: lua-zip
    buildsystem: simple
    build-commands:
      - luarocks install --tree="/app" lua-zip-0.2-0.src.rock ZIP_INCDIR="/app/include" ZIP_LIBDIR="/app/lib" LUA_INCDIR="/app/include"
    sources:
      - type: file
        url: 'https://luarocks.org/manifests/brimworks/lua-zip-0.2-0.src.rock'
        sha256: 106cbef9aaac1742824bead6d2373adfe1f829a536eb0d3435d53ecf9af5b253

  - name: luasql-sqlite3
    buildsystem: simple
    build-commands:
      - luarocks make --tree="/app" luasql-sqlite3-2.7.0-1.rockspec SQLITE_INCDIR="/app/include"
    sources:
      - type: archive
        url: 'https://github.com/lunarmodules/luasql/archive/refs/tags/2.7.0.tar.gz'
        sha256: 15de59f0ea1a2ab205a11e0115d760f8e0c3fee0d3fcc37f52e326a53236e0c7
      - type: file
        url: 'https://luarocks.org/manifests/tomasguisasola/luasql-sqlite3-2.7.0-1.rockspec'
        sha256: 8f7b5a86030e19135df9df65a47545a7003e84ad359f380ff07b3607431e5d3b

  - name: lrexlib-pcre
    buildsystem: simple
    build-commands:
      - luarocks install --tree="/app" lrexlib-pcre-2.9.2-1.src.rock PCRE_INCDIR="/app/include" PCRE_LIBDIR="/app/lib"
    sources:
      - type: file
        url: 'https://luarocks.org/manifests/rrt/lrexlib-pcre-2.9.2-1.src.rock'
        sha256: 55e01bc9eee32995eaf29cb8c12748b824ae1ff2be70dcd28f5579ce797db9e9

  - name: glu
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://ftp.osuosl.org/pub/blfs/conglomeration/glu/glu-9.0.2.tar.xz
        sha256: 6e7280ff585c6a1d9dfcdf2fca489251634b3377bfc33c29e4002466a38d02d4
    cleanup:
      - /include
      - /lib/*.a
      - /lib/*.la
      - /lib/pkgconfig

  - name: mudlet
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    sources:
      - type: dir
        path: ../

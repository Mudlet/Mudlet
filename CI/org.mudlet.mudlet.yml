id: org.mudlet.mudlet
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
command: mudlet
rename-desktop-file: mudlet.desktop
rename-icon: mudlet
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  - --filesystem=home

cleanup:
  - /bin/json_reformat
  - /bin/json_verify

modules:
  - name: lua-5.1
    buildsystem: simple
    build-commands:
      - make -j $FLATPAK_BUILDER_N_JOBS CFLAGS="$CFLAGS -fPIC -DLUA_USE_LINUX" linux
      - make INSTALL_TOP=$FLATPAK_DEST TO_LIB='liblua.a liblua.so.5.1.5' install
      - ln -sf liblua.so.5.1.5 $FLATPAK_DEST/lib/liblua.so
      - ln -sf liblua.so.5.1.5 $FLATPAK_DEST/lib/liblua.so.5.1
      - install -Dm0644 etc/lua.pc $FLATPAK_DEST/lib/pkgconfig/lua.pc
      - ln -sf lua.pc $FLATPAK_DEST/lib/pkgconfig/lua51.pc
      - ln -sf lua.pc $FLATPAK_DEST/lib/pkgconfig/lua5.1.pc
      - ln -sf lua.pc $FLATPAK_DEST/lib/pkgconfig/lua-5.1.pc
    sources:
      - type: archive
        url: 'https://www.lua.org/ftp/lua-5.1.5.tar.gz'
        sha256: 2640fc56a795f29d28ef15e13c34a47e223960b0240e8cb0a82d9b0738695333
      - type: patch
        path: lua-5.1.5-so.patch
      - type: shell
        commands:
          - sed -i "s|/usr/local|$FLATPAK_DEST|" etc/lua.pc src/luaconf.h
    cleanup:
      - '*.a'
      - /bin
      - /include
      - /lib/pkgconfig
      - /man

  - name: libsecret
    buildsystem: meson
    config-opts:
      - -Dmanpage=false
      - -Dvapi=false
      - -Dgtk_doc=false
      - -Dintrospection=false
      # https://gitlab.gnome.org/GNOME/libsecret/-/issues/49
      - -Dgcrypt=false
    sources:
      - commit: 3fe635e64efd4b8dbc9ec3548b0bc8034c7665c4
        tag: 0.20.4
        type: git
        url: https://gitlab.gnome.org/GNOME/libsecret.git
    cleanup:
      - /bin/secret-tool

  - name: libzip
    buildsystem: cmake-ninja
    config-opts:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
    cleanup:
    - "/include"
    - "/bin"
    - "/share"
    - "/lib/pkgconfig"
    - "/lib/*.la"
    sources:
    - type: archive
      url: https://libzip.org/download/libzip-1.9.2.tar.xz
      sha256: c93e9852b7b2dc931197831438fee5295976ee0ba24f8524a8907be5c2ba5937

  - name: pugixml
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_SHARED_LIBS=on .
    sources:
      - type: archive
        url: https://github.com/zeux/pugixml/releases/download/v1.11.4/pugixml-1.11.4.tar.gz
        sha256: 8ddf57b65fb860416979a3f0640c2ad45ddddbbafa82508ef0a0af3ce7061716

  - name: yajl
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - '-DCMAKE_BUILD_TYPE=Release'
    sources:
      - type: archive
        url: 'https://github.com/lloyd/yajl/archive/refs/tags/2.1.0.tar.gz'
        sha256: 3fb73364a5a30efe615046d07e6db9d09fd2b41c763c5f7d3bfb121cd5c5ac5a

  - name: luarocks
    buildsystem: simple
    build-commands:
      - >-
        ./configure --prefix=$FLATPAK_DEST --with-lua=$FLATPAK_DEST
        --with-lua-include=$FLATPAK_DEST/include --lua-version=5.1 --force-config
      - make build
      - make install
    sources:
      - type: git
        url: https://github.com/luarocks/luarocks.git
        tag: v3.13.0
        commit: 3421bedc2ce2b64e79530bb97497531b014899a8
    cleanup:
      - /bin
      - /etc
      - /share/lua/5.1/luarocks

  # Built offline from pinned sources: the sandbox has no network at build time
  - name: lua-modules
    buildsystem: simple
    build-commands:
      - luarocks --tree=$FLATPAK_DEST build --deps-mode=none luafilesystem-1.9.0-1.src.rock
      - luarocks --tree=$FLATPAK_DEST build --deps-mode=none luautf8-0.2.1-1.src.rock
      - luarocks --tree=$FLATPAK_DEST build --deps-mode=none lpeg-1.1.0-2.src.rock
      - luarocks --tree=$FLATPAK_DEST build --deps-mode=none lua-zip-0.2-0.src.rock ZIP_DIR=$FLATPAK_DEST
      - >-
        luarocks --tree=$FLATPAK_DEST build --deps-mode=none lrexlib-pcre2-2.9.4-1.src.rock
        PCRE2_INCDIR=$(pkg-config --variable=includedir libpcre2-8)
        PCRE2_LIBDIR=$(pkg-config --variable=libdir libpcre2-8)
      - cd lua-yajl && luarocks --tree=$FLATPAK_DEST make --deps-mode=none lua-yajl-2.1-0.rockspec YAJL_DIR=$FLATPAK_DEST
      # db:create fails on luasql-sqlite3 2.7 and newer, so every Mudlet build pins it
      - cd luasql && luarocks --tree=$FLATPAK_DEST make --deps-mode=none luasql-sqlite3-2.6.1-3.rockspec
    sources:
      - type: file
        url: https://luarocks.org/luafilesystem-1.9.0-1.src.rock
        sha256: 3de68d619f6ad95a27f4728814375447d921305194b7050dee6199057c31282f
      - type: file
        url: https://luarocks.org/luautf8-0.2.1-1.src.rock
        sha256: 70c1590a6c2cfca417755b0bc79207bdfd0b469f854bfcc4e2cc5a39b5e3e3b6
      - type: file
        url: https://luarocks.org/lpeg-1.1.0-2.src.rock
        sha256: 836d315b920a5cdd62e21786c6c9fad547c4faa131d5583ebca64f0b6595ee76
      - type: file
        url: https://luarocks.org/lua-zip-0.2-0.src.rock
        sha256: 106cbef9aaac1742824bead6d2373adfe1f829a536eb0d3435d53ecf9af5b253
      - type: file
        url: https://luarocks.org/lrexlib-pcre2-2.9.4-1.src.rock
        sha256: d41d736a309b14fed859ed4d3a49de89ef8f6565a7143570ed0cf1ccdbaebf29
      - type: git
        url: https://github.com/brimworks/lua-yajl.git
        branch: v2.1
        commit: 167c294046d5bbdc5bc4a791e6397439b6c825df
        dest: lua-yajl
      - type: file
        url: https://luarocks.org/lua-yajl-2.1-0.rockspec
        sha256: 39d9184c8c184066ebcade2f54a4aa0a76ada66bf5496838c1e30e54487b540a
        dest: lua-yajl
      - type: git
        url: https://github.com/lunarmodules/luasql.git
        tag: 2.6.0
        commit: 22d4a911f35cf851af9db71124e3998d96fb3fa1
        dest: luasql
      - type: file
        url: https://luarocks.org/luasql-sqlite3-2.6.1-3.rockspec
        sha256: cb4f274bb9062becefa4a2e5c63159d09bad5b71bae959cce5cfeaca4867c8e1
        dest: luasql
    cleanup:
      - /lib/luarocks

  - name: boost
    buildsystem: 'simple'
    build-commands:
      # we don't need to build boost, only using it for headers
      - cp -r * /app/include
    sources:
      - type: archive
        url: 'https://sourceforge.net/projects/boost/files/boost/1.83.0/boost_1_83_0.tar.bz2'
        sha256: 6478edfe2f3305127cffe8caf73ea0176c53769f4bf1585be237eb30798c3b8e

  - name: glu
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://ftp.osuosl.org/pub/blfs/conglomeration/glu/glu-9.0.2.tar.xz
        sha256: 6e7280ff585c6a1d9dfcdf2fca489251634b3377bfc33c29e4002466a38d02d4
    cleanup:
      - /include
      - /lib/*.a
      - /lib/*.la
      - /lib/pkgconfig

  # The KDE runtime ships Qt WebSockets but not Qt HttpServer, which the MCP server needs
  - name: qt6-qthttpserver
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://download.qt.io/archive/qt/6.8/6.8.3/submodules/qthttpserver-everywhere-src-6.8.3.tar.xz
        sha256: 792be98dd979a3f1cf42477139321a8999a648b7e7ad041ae133965c3cc35f65
    # Qt installs to /app/lib/<triplet>, which is not on the sandbox's loader path
    post-install:
      - mkdir -p ${FLATPAK_DEST}/etc
      - for dir in ${FLATPAK_DEST}/lib/*-linux-gnu; do echo "$dir" >> ${FLATPAK_DEST}/etc/ld.so.conf; done

  - name: mudlet
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      # The rocks are in /app, where only the Lua built above looks
      - -DUSE_BUNDLED_LUA=OFF
    sources:
      - type: dir
        path: ../

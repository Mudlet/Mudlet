id: org.mudlet.mudlet
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: mudlet
rename-desktop-file: mudlet.desktop
rename-icon: mudlet
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  - --filesystem=home

cleanup:
  - /bin/json_reformat
  - /bin/json_verify

modules:
  - name: lua-5.1
    buildsystem: simple
    build-commands:
      - make -j $FLATPAK_BUILDER_N_JOBS CFLAGS="$CFLAGS -fPIC -DLUA_USE_LINUX" linux
      - make INSTALL_TOP=$FLATPAK_DEST TO_LIB='liblua.a liblua.so.5.1.5' install
      - ln -sf liblua.so.5.1.5 $FLATPAK_DEST/lib/liblua.so
      - ln -sf liblua.so.5.1.5 $FLATPAK_DEST/lib/liblua.so.5.1
      - install -Dm0644 etc/lua.pc $FLATPAK_DEST/lib/pkgconfig/lua.pc
      - ln -sf lua.pc $FLATPAK_DEST/lib/pkgconfig/lua51.pc
      - ln -sf lua.pc $FLATPAK_DEST/lib/pkgconfig/lua5.1.pc
      - ln -sf lua.pc $FLATPAK_DEST/lib/pkgconfig/lua-5.1.pc
    sources:
      - type: archive
        url: 'https://www.lua.org/ftp/lua-5.1.5.tar.gz'
        sha256: 2640fc56a795f29d28ef15e13c34a47e223960b0240e8cb0a82d9b0738695333
      - type: patch
        path: lua-5.1.5-so.patch
      - type: shell
        commands:
          - sed -i "s|/usr/local|$FLATPAK_DEST|" etc/lua.pc src/luaconf.h
    cleanup:
      - '*.a'
      - /bin
      - /include
      - /lib/pkgconfig
      - /man

  - name: libsecret
    buildsystem: meson
    config-opts:
      - -Dmanpage=false
      - -Dvapi=false
      - -Dgtk_doc=false
      - -Dintrospection=false
      - -Dcrypto=disabled
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libsecret/0.21/libsecret-0.21.7.tar.xz
        sha256: 6b452e4750590a2b5617adc40026f28d2f4903de15f1250e1d1c40bfd68ed55e
    cleanup:
      - /bin/secret-tool

  - name: libzip
    buildsystem: cmake-ninja
    config-opts:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
    cleanup:
    - "/include"
    - "/bin"
    - "/share"
    - "/lib/pkgconfig"
    - "/lib/*.la"
    sources:
    - type: archive
      url: https://libzip.org/download/libzip-1.11.4.tar.xz
      sha256: 8a247f57d1e3e6f6d11413b12a6f28a9d388de110adc0ec608d893180ed7097b

  - name: pugixml
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_SHARED_LIBS=on .
    sources:
      - type: archive
        url: https://github.com/zeux/pugixml/releases/download/v1.15/pugixml-1.15.tar.gz
        sha256: 655ade57fa703fb421c2eb9a0113b5064bddb145d415dd1f88c79353d90d511a

  - name: yajl
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - '-DCMAKE_BUILD_TYPE=Release'
      - '-DCMAKE_POLICY_VERSION_MINIMUM=3.5'
    sources:
      - type: archive
        url: 'https://github.com/lloyd/yajl/archive/refs/tags/2.1.0.tar.gz'
        sha256: 3fb73364a5a30efe615046d07e6db9d09fd2b41c763c5f7d3bfb121cd5c5ac5a
      - type: patch
        path: yajl-cmake-fix.patch

  - name: luarocks
    buildsystem: simple
    build-commands:
      - >-
        ./configure --with-lua=/app --prefix=/app
        --with-lua-include=/app/include --force-config
      - make build
      - make install
    build-options:
      strip: false
      no-debuginfo: true
      no-debuginfo-compression: true
    sources:
      - type: archive
        url: 'https://github.com/luarocks/luarocks/archive/refs/tags/v3.12.2.tar.gz'
        sha256: 9c25fa7ab5017d60b25137ab1a4cb76e3185df1fe02df1f577f57d1a6b548a2a
    cleanup:
      - /bin/luarocks*
      - /share/luarocks
      - /etc/luarocks*

  - name: sqlite3
    config-opts:
      - CFLAGS=-O2 -DSQLITE_ENABLE_FTS4 -DSQLITE_ENABLE_RTREE
    sources:
      - type: archive
        url: 'https://sqlite.org/2026/sqlite-autoconf-3510200.tar.gz'
        sha256: fbd89f866b1403bb66a143065440089dd76100f2238314d92274a082d4f2b7bb
    cleanup:
      - /bin/sqlite3

  - name: boost
    buildsystem: simple
    build-commands:
      - cp -r boost /app/include/
    sources:
      - type: archive
        url: https://archives.boost.io/release/1.87.0/source/boost_1_87_0.tar.bz2
        sha256: af57be25cb4c4f4b413ed692fe378affb4352ea50fbe294a11ef548f4d527d89

  - name: lua-yajl
    buildsystem: simple
    build-commands:
      - luarocks install --tree="/app" lua-yajl-2.0-1.src.rock YAJL_INCDIR="/app/include" YAJL_LIBDIR="/app/lib" LUA_INCDIR="/app/include"
    sources:
      - type: file
        url: 'https://luarocks.org/manifests/brimworks/lua-yajl-2.0-1.src.rock'
        sha256: 8e5c5bde4ae4aac336c5ce6da2aef94bf4f69f37e921d718647914bd5328552f

  - name: luautf8
    buildsystem: simple
    build-commands:
      - luarocks install --tree="/app" luautf8-0.2.0-1.src.rock
    sources:
      - type: file
        url: 'https://luarocks.org/manifests/xavier-wang/luautf8-0.2.0-1.src.rock'
        sha256: 36d930b3548d4b1bd87aa607e68b9aca08e23aa27309c34100e3b114d0f45b09

  - name: luafilesystem
    buildsystem: simple
    build-commands:
      - luarocks install --tree="/app" luafilesystem-1.9.0-1.src.rock
    sources:
      - type: file
        url: 'https://luarocks.org/manifests/hisham/luafilesystem-1.9.0-1.src.rock'
        sha256: 3de68d619f6ad95a27f4728814375447d921305194b7050dee6199057c31282f

  - name: lpeg
    buildsystem: simple
    build-commands:
      - luarocks install --tree="/app" lpeg-1.1.0-2.src.rock LUA_INCDIR="/app/include"
    sources:
      - type: file
        url: 'https://luarocks.org/manifests/gvvaughan/lpeg-1.1.0-2.src.rock'
        sha256: 836d315b920a5cdd62e21786c6c9fad547c4faa131d5583ebca64f0b6595ee76

  - name: lua-zip
    buildsystem: simple
    build-commands:
      - luarocks install --tree="/app" lua-zip-0.2-0.src.rock ZIP_INCDIR="/app/include" ZIP_LIBDIR="/app/lib" LUA_INCDIR="/app/include"
    sources:
      - type: file
        url: 'https://luarocks.org/manifests/brimworks/lua-zip-0.2-0.src.rock'
        sha256: 106cbef9aaac1742824bead6d2373adfe1f829a536eb0d3435d53ecf9af5b253

  # db:create fails on luasql-sqlite3 2.7 and newer, so every Mudlet build pins it
  - name: luasql-sqlite3
    buildsystem: simple
    build-commands:
      - luarocks make --tree="/app" luasql-sqlite3-2.6.1-3.rockspec SQLITE_INCDIR="/app/include"
    sources:
      - type: archive
        url: 'https://github.com/lunarmodules/luasql/archive/refs/tags/2.6.0.tar.gz'
        sha256: 8ec445c58fa6148be759080c08f37baea5c3fa84f766197db9bf9c8edb6f8e60
      - type: file
        url: 'https://luarocks.org/manifests/tomasguisasola/luasql-sqlite3-2.6.1-3.rockspec'
        sha256: cb4f274bb9062becefa4a2e5c63159d09bad5b71bae959cce5cfeaca4867c8e1

  - name: lrexlib-pcre2
    buildsystem: simple
    build-commands:
      - luarocks install --tree="/app" lrexlib-pcre2-2.9.4-1.src.rock PCRE2_INCDIR="$(pkg-config --variable=includedir libpcre2-8)" PCRE2_LIBDIR="$(pkg-config --variable=libdir libpcre2-8)"
    sources:
      - type: file
        url: 'https://luarocks.org/manifests/rrt/lrexlib-pcre2-2.9.4-1.src.rock'
        sha256: d41d736a309b14fed859ed4d3a49de89ef8f6565a7143570ed0cf1ccdbaebf29

  - name: glu
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://ftp.osuosl.org/pub/blfs/conglomeration/glu/glu-9.0.2.tar.xz
        sha256: 6e7280ff585c6a1d9dfcdf2fca489251634b3377bfc33c29e4002466a38d02d4
    cleanup:
      - /include
      - /lib/*.a
      - /lib/*.la
      - /lib/pkgconfig

  - name: qtkeychain
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_WITH_QT6=ON
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_TESTING=OFF
    sources:
      - type: git
        url: https://github.com/frankosterfeld/qtkeychain.git
        commit: 875f77d9f61bd97fd84cca47ce3bc71186dfbd09

  - name: mudlet
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DUSE_SANITIZER=
      - -DBUILD_TESTING=OFF
      # Flatpak updates the app, so the built-in updater must not
      - -DUSE_UPDATER=OFF
      - -DUSE_3DMAPPER=OFF
      # The rocks are in /app, where only the Lua built above looks
      - -DUSE_BUNDLED_LUA=OFF
    sources:
      - type: dir
        path: ../
      - type: shell
        commands:
          - sed -i 's/find_package(Boost 1.44 CONFIG REQUIRED)/find_package(Boost 1.44 REQUIRED)/' src/CMakeLists.txt

                    - paragraph [ref=e209]: "Behaviour changes worth knowing about: the noisy categories (every line from the game, trigger capture groups and match state, \"ran without errors\" chatter, selection calls) are off by default, and protocol debug output now appears in the debug console instead of the game window."

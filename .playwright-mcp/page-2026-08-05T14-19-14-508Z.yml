                    - list [ref=e195]:
                      - listitem [ref=e196]: Every debug message now carries a category, and the Central Debug Console gains a toolbar to filter by category, by profile and by text, plus Pause and Clear. The four noisiest categories start off.
                      - listitem [ref=e197]: Filtering happens where a message is written, not where it is drawn, so switching a filter never rewrites what is already on screen - and a filtered-out message is never even assembled, which makes debug mode cheaper than it is today.
                      - listitem [ref=e198]:
                        - text: GMCP/MSDP/MSSP/MXP debug output moves out of the game window (where it appeared as
                        - code [ref=e199]: "System Message: gmcp event <...>"
                        - text: ) into the debug console as a filterable category.
                    - heading "Motivation for adding to Mudlet" [level=4] [ref=e200]
                    - paragraph [ref=e201]: The debug window is unusable on a live profile - 20 triggers against 6 game lines produce about 40 lines of output, three of which are the same game line repeated - so people don't use it.
                    - heading "Other info (issues closed, discussion etc)" [level=4] [ref=e202]

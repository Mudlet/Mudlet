name: Pull request

on:
  pull_request_target:

permissions:
  contents: read
  issues: read

jobs:
  add-milestone:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'Mudlet' }}

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Get next milestone
      id: next-milestone-string
      uses: mikefarah/yq@master
      with:
        cmd: yq eval '.milestones.next-milestone' '.github/repo-metadata.yml'

    - name: 'Convert milestone to Github #'
      env:
        # authenticated so this does not share the per-IP anonymous rate limit
        # with every other job on the runner's address
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        NEXT_MILESTONE: ${{ steps.next-milestone-string.outputs.result }}
      run: |
        set -euo pipefail

        # Milestone titles carry a suffix in practice - "4.23.0 next release" for
        # the bare "4.23.0" in repo-metadata.yml - so an exact-title match found
        # nothing and left every pull request unassigned without failing (#9671).
        # Match the version on its own or as the leading word of the title, and
        # refuse to guess when that is ambiguous.
        MILESTONES=$(gh api "repos/${REPO}/milestones?state=open&per_page=100")
        MATCHES=$(jq -c --arg wanted "$NEXT_MILESTONE" \
          '[.[] | select(.title == $wanted or (.title | startswith($wanted + " ")))]' <<< "$MILESTONES")

        case "$(jq 'length' <<< "$MATCHES")" in
          0)
            echo "::error::No open milestone matches '${NEXT_MILESTONE}' from .github/repo-metadata.yml. Open milestones: $(jq -r '[.[].title] | join(", ")' <<< "$MILESTONES")"
            exit 1
            ;;
          1) ;;
          *)
            echo "::error::'${NEXT_MILESTONE}' matches several open milestones, so it is not clear which one to use: $(jq -r '[.[].title] | join(", ")' <<< "$MATCHES")"
            exit 1
            ;;
        esac

        echo "Milestone: $(jq -r '.[0].title' <<< "$MATCHES")"
        echo "MILESTONE_NUMBER=$(jq -r '.[0].number' <<< "$MATCHES")" >> "$GITHUB_ENV"

    - name: Assign PR to milestone
      env:
        GH_TOKEN: ${{ secrets.GH_PAT_UPDATE_PULL_REQUESTS }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail

        if [ -z "${GH_TOKEN:-}" ]; then
          echo "::error::GH_PAT_UPDATE_PULL_REQUESTS is not available, so the milestone cannot be set"
          exit 1
        fi

        if [ -z "${MILESTONE_NUMBER:-}" ]; then
          echo "::error::No milestone number was resolved by the previous step"
          exit 1
        fi

        # Whoever set a milestone by hand meant it, so only fill in an empty one
        if [ -n "$(gh api "repos/${REPO}/issues/${PR_NUMBER}" --jq '.milestone.number // empty')" ]; then
          echo "Pull request already has a milestone, leaving it as it is"
          exit 0
        fi

        gh api --method PATCH "repos/${REPO}/issues/${PR_NUMBER}" -F "milestone=${MILESTONE_NUMBER}" --silent

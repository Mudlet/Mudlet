# Temporary: reproduce QTBUG-147602 on macOS runners, Qt 6.11.1 against 6.11.3
name: QTBUG-147602 repro
on:
  push:
    branches:
      - claude/macos-27-2-crashes-xibrrj
    paths:
      - '.github/qtbug-147602-repro/**'
      - '.github/workflows/zz-qtbug-147602-repro.yml'
  workflow_dispatch:

jobs:
  repro:
    name: minimal / ${{ matrix.os }} / Qt ${{ matrix.qt }}
    runs-on: ${{ matrix.os }}
    if: ${{ github.repository_owner == 'Mudlet' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, xcode-27]
        qt: ['6.11.1', '6.11.3']
    steps:
    - uses: actions/checkout@v7
      with:
        sparse-checkout: .github/qtbug-147602-repro

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ matrix.qt }}
        dir: ${{ runner.workspace }}
        cache: false

    - name: Build
      working-directory: .github/qtbug-147602-repro
      run: |
        sw_vers
        cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
        cmake --build build

    - name: Run
      working-directory: .github/qtbug-147602-repro
      run: |
        set +e
        shim="$PWD/build/libuncached_colorspace.dylib"
        run() {
          local label="$1"; shift
          for attempt in 1 2 3; do
            echo "::group::$label (attempt $attempt)"
            env "$@"
            local code=$?
            echo "::endgroup::"
            echo "RESULT|$label|attempt $attempt|exit $code"
          done
        }
        for mode in image cursor; do
          run "$mode plain" ./build/repro "$mode" spincursor.png
          run "$mode uncached colour space" DYLD_INSERT_LIBRARIES="$shim" ./build/repro "$mode" spincursor.png
          run "$mode uncached colour space + MallocScribble" DYLD_INSERT_LIBRARIES="$shim" MallocScribble=1 ./build/repro "$mode" spincursor.png
        done 2>&1 | tee run.log
        echo "## $(sw_vers -productVersion) ($(sw_vers -buildVersion)) / Qt ${{ matrix.qt }}" >> "$GITHUB_STEP_SUMMARY"
        grep '^RESULT|' run.log | sed 's/^RESULT|/- /' >> "$GITHUB_STEP_SUMMARY"

  mudlet:
    name: Mudlet 5.0.1 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: ${{ github.repository_owner == 'Mudlet' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, xcode-27]
    steps:
    - uses: actions/checkout@v7
      with:
        sparse-checkout: .github/qtbug-147602-repro

    - name: Install Qt 6.11.3
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.11.3'
        dir: ${{ runner.workspace }}
        cache: false
        modules: qt5compat qtmultimedia qtspeech qtwebsockets qthttpserver qtimageformats

    - name: Build shim
      working-directory: .github/qtbug-147602-repro
      run: |
        sw_vers
        cmake -S . -B build -DSHIM_ONLY=ON
        cmake --build build

    - name: Prepare Mudlet 5.0.1 (Qt 6.11.1) and a copy on Qt 6.11.3
      run: |
        curl -sSLf -o mudlet.dmg https://github.com/Mudlet/Mudlet/releases/download/Mudlet-5.0.1/Mudlet-5.0.1-arm64.dmg
        hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" mudlet.dmg
        src=$(find "$RUNNER_TEMP/dmg" -maxdepth 1 -name '*.app' | head -1)
        ditto "$src" "$RUNNER_TEMP/qt6111/Mudlet.app"
        hdiutil detach "$RUNNER_TEMP/dmg"
        ditto "$RUNNER_TEMP/qt6111/Mudlet.app" "$RUNNER_TEMP/qt6113/Mudlet.app"
        app="$RUNNER_TEMP/qt6113/Mudlet.app"
        echo "::group::Qt swapped in"
        for fw in "$app"/Contents/Frameworks/Qt*.framework; do
          name=$(basename "$fw")
          if [ -d "$QT_ROOT_DIR/lib/$name" ]; then
            rm -rf "$fw"; ditto "$QT_ROOT_DIR/lib/$name" "$fw"; echo "framework $name"
          else
            echo "::warning::$name left at 6.11.1"
          fi
        done
        for plugin in "$app"/Contents/PlugIns/*/*.dylib; do
          rel=${plugin#"$app/Contents/PlugIns/"}
          if [ -f "$QT_ROOT_DIR/plugins/$rel" ]; then
            cp -f "$QT_ROOT_DIR/plugins/$rel" "$plugin"; echo "plugin $rel"
          else
            echo "plugin $rel left as shipped"
          fi
        done
        echo "::endgroup::"
        strings "$RUNNER_TEMP/qt6111/Mudlet.app/Contents/Frameworks/QtCore.framework/Versions/A/QtCore" | grep -m1 -E '^Qt 6\.[0-9]+\.[0-9]+' || true
        strings "$app/Contents/Frameworks/QtCore.framework/Versions/A/QtCore" | grep -m1 -E '^Qt 6\.[0-9]+\.[0-9]+' || true
        # Ad-hoc signatures without the hardened runtime, so DYLD_INSERT_LIBRARIES and lldb work
        codesign --force --deep --sign - "$RUNNER_TEMP/qt6111/Mudlet.app"
        codesign --force --deep --sign - "$app"

    - name: Launch
      working-directory: .github/qtbug-147602-repro
      run: |
        set +e
        shim="$PWD/build/libuncached_colorspace.dylib"
        {
          ./run-mudlet.sh "5.0.1 on Qt 6.11.1" "$RUNNER_TEMP/qt6111/Mudlet.app"
          ./run-mudlet.sh "5.0.1 on Qt 6.11.1, uncached colour space" "$RUNNER_TEMP/qt6111/Mudlet.app" "$shim"
          ./run-mudlet.sh "5.0.1 on Qt 6.11.3" "$RUNNER_TEMP/qt6113/Mudlet.app"
          ./run-mudlet.sh "5.0.1 on Qt 6.11.3, uncached colour space" "$RUNNER_TEMP/qt6113/Mudlet.app" "$shim"
        } 2>&1 | tee run.log
        echo "## $(sw_vers -productVersion) ($(sw_vers -buildVersion))" >> "$GITHUB_STEP_SUMMARY"
        grep '^RESULT|' run.log | sed 's/^RESULT|/- /' >> "$GITHUB_STEP_SUMMARY"

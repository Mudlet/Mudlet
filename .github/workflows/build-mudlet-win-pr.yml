# DUPLICATE WORKFLOW: This file is paired with build-mudlet-win.yml
# Changes here likely need to be mirrored there as well, apart from the ccache
# handling: caches here are scoped to their own pull request ref and keyed per
# commit, so there is never a key to delete before saving one. The generations
# an earlier push left behind are retired by cleanup-caches.yml instead, which
# runs in the base repository and so has a writable token even for a fork.
name: 🔨 Build Mudlet - PR (windows)
on:
  pull_request:

# Permissions required for SignPath trusted build verification
permissions:
  id-token: write
  contents: read
  actions: read
  pull-requests: read

jobs:
  changes:
    name: detect buildable changes
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'Mudlet' }}
    outputs:
      build: ${{steps.filter.outputs.build}}
    steps:
    - name: Check whether anything affecting the build changed
      id: filter
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Only genuinely inert paths are listed - CI, CMake and packaging scripts
        # all affect the build. Anything unexpected falls through to building.
        files=$(gh api --paginate \
          "/repos/${{github.repository}}/pulls/${{github.event.pull_request.number}}/files" \
          -q '.[].filename')
        echo "Changed files:"
        printf '%s\n' "$files"

        if printf '%s\n' "$files" | grep -qvE '(^docs/|^\.github/ISSUE_TEMPLATE/|\.md$)'; then
          echo "build=true" >> "$GITHUB_OUTPUT"
        else
          echo "build=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Documentation-only change - skipping the build matrix"
        fi

  compile-mudlet:
    name: ${{matrix.buildname}}
    runs-on: ${{matrix.os}}
    needs: changes
    if: ${{ github.repository_owner == 'Mudlet' && needs.changes.outputs.build == 'true' }}
    concurrency:
      group: ${{github.workflow}}-${{matrix.buildname}}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      BUILD_TASK: 'PR'
      SIGNPATH_SIGNING_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
      SIGNPATH_POLICY_SLUG: ${{ startsWith(github.ref, 'refs/tags/') && 'release-signing' || 'test-signing' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            buildname: 'windows64'

    steps:
    - name: Checkout Mudlet source code
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0

    - name: (Windows) Setup MSYS2
      if: matrix.buildname == 'windows64'
      uses: msys2/setup-msys2@v2
      with:
        msystem: CLANG64
        update: true

    - name: (Windows) Build Environment Setup
      shell: msys2 {0}
      env:
        GITHUB_REPO_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        SENTRY_SEND_DEBUG: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule' || github.event.inputs.scheduled == 'true') && '1' || '0' }}
      run: |
        $GITHUB_WORKSPACE/CI/setup-windows-sdk.sh
        $GITHUB_WORKSPACE/CI/validate-deployment-for-windows.sh

    - name: Restore ccache
      id: restore-ccache
      uses: actions/cache/restore@v6
      with:
        path: ${{runner.workspace}}/ccache
        key: ccache-${{matrix.os}}-${{matrix.buildname}}-clang-${{ github.sha }}
        restore-keys: ccache-${{matrix.os}}-${{matrix.buildname}}-clang

    - name: check ccache stats prior to build
      shell: msys2 {0}
      env:
        CCACHE_DIR: ${{runner.workspace}}/ccache
      run: ccache --zero-stats --show-stats

    - name: Get sentry-native commit hash
      shell: msys2 {0}
      id: sentry-hash
      run: echo "SENTRY_HASH=$(git -C 3rdparty/sentry-native rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Cache sentry-native
      id: cache-sentry
      uses: actions/cache@v6
      with:
        path: |
          3rdparty/sentry-native/install_without_transport
          3rdparty/sentry-native/install_with_transport
        key: sentry-${{ runner.os }}-${{ runner.arch }}-${{ steps.sentry-hash.outputs.SENTRY_HASH }}

    - name: (Windows) Build
      shell: msys2 {0}
      env:
        GITHUB_REPO_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        GITHUB_SCHEDULED_BUILD: ${{ github.event_name == 'schedule' || github.event.inputs.scheduled == 'true' }}
        GITHUB_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        GITHUB_PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Enable debug sending only for tags and scheduled builds (Release builds and PTB builds)
        SENTRY_SEND_DEBUG: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule' || github.event.inputs.scheduled == 'true') && '1' || '0' }}
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        WITH_SENTRY: "ON"
      run: $GITHUB_WORKSPACE/CI/build-mudlet-for-windows.sh

    - name: check ccache stats post build
      shell: msys2 {0}
      env:
        CCACHE_DIR: ${{runner.workspace}}/ccache
      run: ccache --show-stats

    - name: (Windows) Run QTest
      shell: msys2 {0}
      run: |
        LUA_PATH=$(luarocks --lua-version 5.1 path --lr-path)
        export LUA_PATH
        LUA_CPATH=$(luarocks --lua-version 5.1 path --lr-cpath)
        export LUA_CPATH

        ctest --test-dir $GITHUB_WORKSPACE/build-$MSYSTEM/test --output-on-failure -j $(nproc)
      env:
        # This runner has Qt's FFmpeg backend and can decode, so TMediaLoopTest must
        # demonstrate every media behaviour rather than skip any of them. Without a floor
        # somewhere, a lost codec or a changed default backend would turn the whole file
        # green-by-skip on every platform and say nothing about it.
        MUDLET_MEDIA_TESTS_REQUIRE_PLAYBACK: 1

    - name: (Windows) Run Lua tests
      # ~94s measured here, and a slow runner can take half again as long - kept in
      # step with the other platforms
      timeout-minutes: 6
      shell: msys2 {0}
      env:
        AUTORUN_BUSTED_TESTS: 'true'
        MUDLET_TEST_MODE: 1
        MUDLET_TEST_REQUIRE_TTS_MOCK: 1
        MUDLET_TEST_REQUIRE_HTTP_FIXTURE: 1
        TESTS_DIRECTORY: ${{github.workspace}}/src/mudlet-lua/tests
        QUIT_MUDLET_AFTER_TESTS: 'true'
      run: |
        LUA_PATH=$(luarocks --lua-version 5.1 path --lr-path)
        export LUA_PATH
        LUA_CPATH=$(luarocks --lua-version 5.1 path --lr-cpath)
        export LUA_CPATH

        # Linux and macOS start the fixture HTTP server in a step of their own,
        # but each msys2 step here is its own shell and a process backgrounded
        # in one is not guaranteed to still be around in the next, so start the
        # server in the very shell that runs the tests and stop it on the way
        # out. Paths are handed over in mixed form (C:/...) because bash and
        # the native Windows python both understand that.
        temp_dir="$(cygpath -m "${RUNNER_TEMP}")"
        port_file="${temp_dir}/mudlet-http-fixture-port"
        fixture_log="${temp_dir}/http-fixture-server.log"
        rm -f "${port_file}"
        python_bin=python3
        command -v "${python_bin}" > /dev/null 2>&1 || python_bin=python
        MUDLET_TEST_HTTP_PORT_FILE="${port_file}" "${python_bin}" "$GITHUB_WORKSPACE/CI/http-fixture-server.py" > "${fixture_log}" 2>&1 &
        fixture_pid=$!
        # Disowned so that stopping it is not reported as a job crash, and -9
        # because a plain SIGTERM does not reach a native Windows process from
        # msys2. The server's log is one line when all is well, so print it
        # either way rather than only where trouble is expected.
        disown "${fixture_pid}" 2>/dev/null || true
        trap 'kill -9 "${fixture_pid}" > /dev/null 2>&1 || true; cat "${fixture_log}" 2>/dev/null || true' EXIT
        for _ in $(seq 1 100); do
          [ -s "${port_file}" ] && break
          sleep 0.1
        done
        if [ ! -s "${port_file}" ]; then
          echo "fixture HTTP server failed to start" >&2
          exit 1
        fi
        MUDLET_TEST_HTTP_PORT="$(cat "${port_file}")"
        export MUDLET_TEST_HTTP_PORT
        if ! curl -fsS --max-time 10 "http://127.0.0.1:${MUDLET_TEST_HTTP_PORT}/fixture.txt" > /dev/null; then
          echo "fixture HTTP server is not serving fixtures" >&2
          exit 1
        fi
        echo "fixture HTTP server ready on 127.0.0.1:${MUDLET_TEST_HTTP_PORT}"

        $GITHUB_WORKSPACE/build-$MSYSTEM/release/mudlet.exe --profile "Mudlet self-test" --offline

    - name: Passed Lua tests
      shell: msys2 {0}
      run: |
        if [ -e $TEMP/busted-tests-failed ]
        then
          echo "Lua tests failed - see the action called 'Run Lua tests' above for detailed output."
          exit 1
        fi

    - name: Save ccache
      if: always() && steps.restore-ccache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{runner.workspace}}/ccache
        key: ${{ steps.restore-ccache.outputs.cache-primary-key }}

    - name: (Windows) Package
      shell: msys2 {0}
      run: $GITHUB_WORKSPACE/CI/package-mudlet-for-windows.sh
      env:
        WITH_SENTRY: "ON"

    - name: (Windows) Prepare binaries for signing
      id: prepare-signing
      if: |
        env.SIGNPATH_SIGNING_ENABLED == 'true' &&
        (startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule' || github.event.inputs.scheduled == 'true')
      shell: msys2 {0}
      run: |
        set -o pipefail
        PACKAGE_DIR="${GITHUB_WORKSPACE}/package-${MSYSTEM}-release"
        # Staged a level deep: SignPath only documents ** as matching
        # subdirectories, so a pattern cannot be relied on to reach the ZIP root
        STAGING_DIR="${GITHUB_WORKSPACE}/signing-binaries/app"
        rm -rf "${GITHUB_WORKSPACE}/signing-binaries"
        mkdir -p "${STAGING_DIR}"

        cd "${PACKAGE_DIR}" || exit 1
        find . -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0 \
          | xargs -0 cp --parents -t "${STAGING_DIR}" || exit 1
        echo "Staged $(find "${STAGING_DIR}" -type f | wc -l) binaries for signing"

        echo "SIGNING_DIR=$(cygpath -aw "${GITHUB_WORKSPACE}/signing-binaries")" >> $GITHUB_ENV

    - name: (Windows) Upload unsigned binaries for signing
      id: upload-unsigned-binaries
      if: steps.prepare-signing.outcome == 'success'
      uses: actions/upload-artifact@v7
      with:
        name: unsigned-binaries
        path: ${{env.SIGNING_DIR}}
        if-no-files-found: error
        retention-days: 1

    - name: (Windows) Sign binaries with SignPath
      id: sign-binaries
      if: steps.upload-unsigned-binaries.outcome == 'success'
      uses: signpath/github-action-submit-signing-request@v2
      with:
        api-token: ${{secrets.SIGNPATH_API_TOKEN}}
        organization-id: ${{secrets.SIGNPATH_ORGANIZATION_ID}}
        project-slug: 'mudlet'
        signing-policy-slug: ${{env.SIGNPATH_POLICY_SLUG}}
        artifact-configuration-slug: 'binaries'
        github-artifact-id: ${{steps.upload-unsigned-binaries.outputs.artifact-id}}
        wait-for-completion: true
        output-artifact-directory: ${{github.workspace}}/signed-binaries
        wait-for-completion-timeout-in-seconds: 3600

    - name: (Windows) Replace binaries with signed versions
      if: steps.sign-binaries.outcome == 'success'
      shell: msys2 {0}
      run: |
        set -o pipefail
        SIGNED_DIR="${GITHUB_WORKSPACE}/signed-binaries/app"
        PACKAGE_DIR="${GITHUB_WORKSPACE}/package-${MSYSTEM}-release"

        cd "${SIGNED_DIR}" || exit 1
        find . -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0 \
          | xargs -0 cp --parents -t "${PACKAGE_DIR}" || exit 1
        echo "Replaced $(find . -type f \( -iname '*.exe' -o -iname '*.dll' \) | wc -l) binaries with signed versions."

    - name: (Windows) Verify binaries are signed
      # Deliberately not gated on the signing steps: a release build that
      # skipped them must fail here rather than ship unsigned binaries
      if: |
        startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule' || github.event.inputs.scheduled == 'true'
      shell: pwsh
      run: |
        $packageDir = Join-Path "${{github.workspace}}" "package-CLANG64-release"
        $binaries = Get-ChildItem -Path $packageDir -Recurse -File |
          Where-Object { $_.Extension -in '.exe', '.dll' }
        if (-not $binaries) {
          Write-Output "::error::No binaries found in $packageDir to verify"
          exit 1
        }
        $signatures = $binaries | ForEach-Object { Get-AuthenticodeSignature $_.FullName }
        $signatures | Group-Object Status | ForEach-Object { Write-Output "$($_.Count) $($_.Name)" }
        $bad = $signatures | Where-Object { $_.Status -ne 'Valid' }
        if ($bad) {
          Write-Output "::error::$($bad.Count) of $($binaries.Count) binaries do not have a valid signature"
          $bad | ForEach-Object { Write-Output "  $($_.Status) $($_.Path)" }
          exit 1
        }
        Write-Output "All $($binaries.Count) binaries in the package have a valid signature."

    - name: (Windows) Create portable ZIP
      # Runs after signing so the portable ships the same signed binaries as the installer
      shell: msys2 {0}
      run: $GITHUB_WORKSPACE/CI/create-portable-zip-for-windows.sh

    - name: (Windows) Deploy
      shell: msys2 {0}
      env:
        DBLSQD_USER: ${{secrets.DBLSQD_USER}}
        DBLSQD_PASS: ${{secrets.DBLSQD_PASS}}
        DEPLOY_KEY_PASS: ${{secrets.DEPLOY_KEY_PASS}}
        X_WP_DOWNLOAD_TOKEN: ${{secrets.X_WP_DOWNLOAD_TOKEN}}
        DEPLOY_SSH_KEY: ${{secrets.UPLOAD_PRIVATEKEY}}
        DEPLOY_PATH: ${{secrets.DEPLOY_PATH}}
        GITHUB_REPO_NAME: ${{ github.repository }}
        GITHUB_REPO_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        GITHUB_SCHEDULED_BUILD: ${{ github.event_name == 'schedule' || github.event.inputs.scheduled == 'true' }}
        GITHUB_FORCE_BUILD: ${{ github.event.inputs.scheduled == 'true' }}
        GITHUB_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        GITHUB_PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # needed so deploy-mudlet-for-windows.sh can query existing releases to skip duplicate PTBs
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: $GITHUB_WORKSPACE/CI/deploy-mudlet-for-windows.sh

    - name: (Windows) Upload unsigned installer for signing
      id: upload-unsigned-installer
      if: |
        env.ARTIFACT_NAME != '' &&
        env.SIGNPATH_SIGNING_ENABLED == 'true' &&
        (startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule' || github.event.inputs.scheduled == 'true') &&
        contains(env.ARTIFACT_NAME, 'installer')
      uses: actions/upload-artifact@v7
      with:
        name: unsigned-installer
        path: ${{env.ARTIFACT_WINPATHORFILE}}
        if-no-files-found: error
        retention-days: 1

    - name: (Windows) Sign installer with SignPath
      id: sign-installer
      if: steps.upload-unsigned-installer.outcome == 'success'
      uses: signpath/github-action-submit-signing-request@v2
      with:
        api-token: ${{secrets.SIGNPATH_API_TOKEN}}
        organization-id: ${{secrets.SIGNPATH_ORGANIZATION_ID}}
        project-slug: 'mudlet'
        signing-policy-slug: ${{env.SIGNPATH_POLICY_SLUG}}
        artifact-configuration-slug: 'installer'
        github-artifact-id: ${{steps.upload-unsigned-installer.outputs.artifact-id}}
        wait-for-completion: true
        output-artifact-directory: ${{github.workspace}}/signed-installer
        wait-for-completion-timeout-in-seconds: 3600

    - name: (Windows) Replace installer with signed version
      if: steps.sign-installer.outcome == 'success'
      shell: msys2 {0}
      run: |
        SIGNED_DIR="${GITHUB_WORKSPACE}/signed-installer"
        SIGNED_INSTALLER=$(find "${SIGNED_DIR}" -name "*.exe" -type f | head -1)
        if [ -n "${SIGNED_INSTALLER}" ]; then
          ORIGINAL_PATH=$(cygpath -au "${ARTIFACT_WINPATHORFILE}")
          if [ -d "${ORIGINAL_PATH}" ]; then
            ORIGINAL_EXE=$(find "${ORIGINAL_PATH}" -name "*.exe" -type f | head -1)
            cp -v "${SIGNED_INSTALLER}" "${ORIGINAL_EXE}"
          else
            cp -v "${SIGNED_INSTALLER}" "${ORIGINAL_PATH}"
          fi
          echo "Installer signing complete."
        else
          echo "Warning: No signed installer found in ${SIGNED_DIR}"
        fi

    - name: Create intermediate artifact for debugging
      uses: actions/upload-artifact@v7
      if: env.INTERMEDIATE_ARTIFACT_NAME
      with:
        name: ${{env.INTERMEDIATE_ARTIFACT_NAME}}
        path: ${{env.INTERMEDIATE_ARTIFACT_WINPATHORFILE}}
        compression-level: ${{env.INTERMEDIATE_ARTIFACT_COMPRESSION}}
        if-no-files-found: ignore

    - name: Create artifact for later uploading
      # Uploads the zipped contents of ARTIFACT_WINPATHORFILE as an "artifact" with
      # the given name - the Environmental variables are created by the
      # deploy-mudlet-for-windows.sh script:
      uses: actions/upload-artifact@v7
      if: env.ARTIFACT_NAME
      with:
        name: ${{env.ARTIFACT_NAME}}
        path: ${{env.ARTIFACT_WINPATHORFILE}}
        compression-level: ${{env.ARTIFACT_COMPRESSION}}

    - name: Upload artifact to make.mudlet.org
      shell: msys2 {0}
      if: env.ARTIFACT_NAME
      # --fail-with-body: gha_queue.php reports refusals (e.g. a duplicate artifact name after a
      # job re-run) as a 4xx with the reason in the body, which plain curl would exit 0 on
      run: curl --fail-with-body --retry 5 -X POST "https://make.mudlet.org/snapshots/gha_queue.php?artifact_name=${{env.ARTIFACT_NAME}}&unzip=${{env.ARTIFACT_UNZIP}}"

    - name: Register PTB Release
      shell: msys2 {0}
      if: ${{ (github.event_name == 'schedule' || github.event.inputs.scheduled == 'true') && env.VERSION_STRING != '' }}
      env:
        VERSION_STRING: ${{env.VERSION_STRING}}
        BUILD_COMMIT: ${{env.BUILD_COMMIT}}
      run: $GITHUB_WORKSPACE/CI/register-windows-release.sh

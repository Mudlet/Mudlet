name: 🔨 Build Mudlet
on:
  push:
    branches: [master, development, release-*]
    tags: [Mudlet-*]
  pull_request:
  workflow_dispatch:
    inputs:
      scheduled:
        description: 'Imitate a scheduled build'
        required: false
        default: 'false'
  schedule:
    - cron: '0 2 * * *'

jobs:
  compile-mudlet:
    name: ${{matrix.buildname}}
    runs-on: ${{matrix.os}}
    if: ${{ github.repository_owner == 'Mudlet' }}
    env:
      LUA_VERSION: '5.1.5'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            buildname: 'ubuntu / gcc / lua tests'
            compiler: gcc_64
            gcc_compiler_version: 11
            qt: '6.9.0'
            deploy: 'deploy'
            run_tests: 'true'

          - os: ubuntu-22.04
            buildname: 'ubuntu (x86_64)'
            compiler: gcc_64
            gcc_compiler_version: 12
            qt: '6.9.0'

          - os: ubuntu-latest
            buildname: 'ubuntu / clang'
            compiler: clang_64
            gcc_compiler_version: 11
            qt: '6.9.0'

          - os: macos-15-intel
            buildname: 'macos (x86_64) / c++, lua tests'
            compiler: clang_64
            qt: '6.9.0'
            deploy: 'deploy'
            run_tests: 'true'

          - os: macos-14
            buildname: 'macos (arm64) / c++, lua tests'
            compiler: clang_64
            qt: '6.9.0'
            deploy: 'deploy'
            run_tests: 'true'

    steps:
    - name: Checkout Mudlet source code
      uses: actions/checkout@v5
      with:
        submodules: true
        fetch-depth: 0

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{matrix.qt}}
        dir: ${{runner.workspace}}
        cache: true
        modules: qt5compat qtmultimedia

    - name: Use CMake 3.30.3
      uses: lukka/get-cmake@v3.30.3

    - name: (macOS) Install Lua via GitHub Actions
      if: runner.os == 'macOS'
      uses: leafo/gh-actions-lua@v12
      with:
        luaVersion: ${{ env.LUA_VERSION }}
        buildCache: false

    - name: (macOS) Install Luarocks via GitHub Actions
      if: runner.os == 'macOS'
      uses: leafo/gh-actions-luarocks@v6

    - name: (macOS) Install dependencies
      if: runner.os == 'macOS'
      env:
        HOMEBREW_NO_ANALYTICS: "ON"
        HOMEBREW_NO_AUTO_UPDATE: "ON"
        HOMEBREW_NO_BOTTLE_SOURCE_FALLBACK: "ON"
        HOMEBREW_NO_INSTALL_CLEANUP: "ON"
      run: |
        BREWS=("libzzip" "libzip" "ccache" "expect" "assimp" "hunspell" "pcre" "pugixml" "sqlite" "yajl" "boost")
        for brew in "${BREWS[@]}"; do
          if ! brew list --formula "${brew}" &>/dev/null; then
            echo "Installing ${brew}..."
            brew install "$brew"
          else
            echo "${brew} is already installed."
          fi
        done

        echo "CCACHE_DIR=${{runner.workspace}}/ccache" >> $GITHUB_ENV
        echo "DEVELOPER_DIR=$(xcode-select --print-path)" >> $GITHUB_ENV
        echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> $GITHUB_ENV

        if [ "$(uname -m)" = "arm64" ]; then
          HOMEBREW_PREFIX=/opt/homebrew
        else
          HOMEBREW_PREFIX=/usr/local
        fi
        echo "HOMEBREW_PREFIX=$HOMEBREW_PREFIX" >> $GITHUB_ENV

        echo "LUA_DIR=$HOME/.lua" >> $GITHUB_ENV
        echo "PKG_CONFIG_PATH=${HOMEBREW_PREFIX}/opt/pcre/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

        luarocks --lua-version 5.1 install --local lua-yajl YAJL_DIR=${HOMEBREW_PREFIX}/opt/yajl
        eval "$(luarocks path --local --lua-version "5.1")"
        echo "LUA_PATH=$LUA_PATH" >> $GITHUB_ENV
        echo "LUA_CPATH=$LUA_CPATH" >> $GITHUB_ENV

    - name: (Linux) Install Lua via GitHub Actions
      uses: leafo/gh-actions-lua@v12
      if: runner.os == 'Linux'
      with:
        luaVersion: ${{ env.LUA_VERSION }}
        buildCache: false

    - name: (Linux) Install Luarocks via GitHub Actions
      uses: leafo/gh-actions-luarocks@v6
      if: runner.os == 'Linux'

    - name: (Linux) Install dependencies
      if: runner.os == 'Linux'
      run: |
        sudo add-apt-repository ppa:ubuntu-toolchain-r/test
        sudo apt-get update

        sudo apt-get install \
          libcurl4-openssl-dev \
          libsecret-1-dev \
          ccache \
          pkg-config \
          pcregrep \
          expect \
          libzip-dev \
          libglu1-mesa-dev \
          libpulse-dev \
          g++-${{matrix.gcc_compiler_version}} \
          libxkbcommon-x11-0 \
          imagemagick \
          libassimp-dev \
          libpcre3-dev \
          libpugixml-dev \
          libsqlite3-dev \
          libyajl-dev \
          libhunspell-dev \
          liblua5.1-0-dev \
          libboost-dev \
          libpipewire-0.3-dev -y

        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${{matrix.gcc_compiler_version}} ${{matrix.gcc_compiler_version}}
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-${{matrix.gcc_compiler_version}} ${{matrix.gcc_compiler_version}}
        sudo update-alternatives --set gcc /usr/bin/gcc-${{matrix.gcc_compiler_version}}
        sudo update-alternatives --set g++ /usr/bin/g++-${{matrix.gcc_compiler_version}}

        echo "CCACHE_DIR=${{runner.workspace}}/ccache" >> $GITHUB_ENV

        luarocks --lua-version 5.1 install --local lua-yajl
        eval "$(luarocks path --local --lua-version "5.1")"
        echo "LUA_PATH=$LUA_PATH" >> $GITHUB_ENV
        echo "LUA_CPATH=$LUA_CPATH" >> $GITHUB_ENV

    - name: Enable sentry.io for releases
      if: matrix.deploy == 'deploy'
      run: echo "WITH_SENTRY=yes" >> $GITHUB_ENV

    - name: (Linux Clang) change compiler & disable optional components
      if: runner.os == 'Linux' && matrix.compiler == 'clang_64'
      run: |
        echo "CXX=clang++" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "WITH_UPDATER=no" >> $GITHUB_ENV
        echo "WITH_3DMAPPER=no" >> $GITHUB_ENV
        echo "WITH_FONTS=no" >> $GITHUB_ENV

    - name: Restore ccache
      id: restore-ccache
      uses: actions/cache/restore@v4
      with:
        path: ${{runner.workspace}}/ccache
        key: ccache-${{matrix.os}}-${{matrix.compiler}}-${{matrix.qt}}-${{ github.sha }}
        restore-keys: ccache-${{matrix.os}}-${{matrix.compiler}}-${{matrix.qt}}

    - name: (Linux) Set build info
      if: runner.os == 'Linux'
      env:
        GITHUB_EVENT_INPUTS_SCHEDULED: ${{inputs.scheduled}}
      run: |
        sudo apt-get -y install pcregrep
        ${{github.workspace}}/CI/travis.validate_deployment.sh
        ${{github.workspace}}/CI/travis.set-build-info.sh

    - name: (macOS) Set build info
      if: runner.os == 'macOS'
      env:
        GITHUB_EVENT_INPUTS_SCHEDULED: ${{inputs.scheduled}}
      run: |
        brew install pcre
        ${{github.workspace}}/CI/travis.validate_deployment.sh
        ${{github.workspace}}/CI/travis.set-build-info.sh
        echo "CXX=clang++" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV

    - name: check ccache stats prior to build
      run: ccache --zero-stats --show-stats

    - name: Build Mudlet
      uses: lukka/run-cmake@v3
      with:
        cmakeListsOrSettingsJson: CMakeListsTxtAdvanced
        cmakeListsTxtPath: '${{github.workspace}}/CMakeLists.txt'
        buildDirectory: '${{runner.workspace}}/b/ninja'
        cmakeAppendedArgs: >-
          -G Ninja
          -DCMAKE_PREFIX_PATH=${{ env.QT_PREFIX != '' && env.QT_PREFIX || env.MINGW_BASE_DIR }}
          -DVCPKG_APPLOCAL_DEPS=OFF
          -D WITH_SENTRY=${{ matrix.deploy == 'deploy' && 'ON' || 'OFF' }}
          ${{ runner.os == 'macOS' && format('-DLUA_INCLUDE_DIR={0}/.lua/include -DLUA_LIBRARY={0}/.lua/lib/liblua.a', github.workspace) || '' }}
          -DUSE_SANITIZER=""
      env:
        NINJA_STATUS: '[%f/%t %o/sec] '

    - name: Save ccache
      if: always() && steps.restore-ccache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{runner.workspace}}/ccache
        key: ${{ steps.restore-ccache.outputs.cache-primary-key }}

    - name: check ccache stats post build
      run: ccache --show-stats

    - name: (macOS) Run C++ tests
      if: runner.os == 'macOS'
      working-directory: '${{runner.workspace}}/b/ninja'
      run: ctest --output-on-failure

    - name: install dependencies for packaging/tests
      if: matrix.deploy == 'deploy' || matrix.run_tests == 'true'
      run: |
        LUAROCKS="luarocks --lua-version 5.1 install --local"

        $LUAROCKS LuaFileSystem
        $LUAROCKS luautf8

        if [ "$RUNNER_OS" = "macOS" ]; then
          if [ "$(uname -m)" = "arm64" ]; then
            ZIP_PREFIX=/opt/homebrew/opt/libzip
            SQLITE_PREFIX=/opt/homebrew/opt/sqlite
            PCRE_PREFIX=/opt/homebrew/opt/pcre
          else
            ZIP_PREFIX=/usr/local/opt/libzip
            SQLITE_PREFIX=/usr/local/opt/sqlite
            PCRE_PREFIX=/usr/local/opt/pcre
          fi
          luarocks --lua-version 5.1 install --local lua-zip ZIP_DIR=$ZIP_PREFIX
          luarocks --lua-version 5.1 install --local LuaSQL-SQLite3 2.6.1 SQLITE_DIR=$SQLITE_PREFIX
          luarocks --lua-version 5.1 install --local lrexlib-pcre 2.9.1-1 PCRE_DIR=$PCRE_PREFIX
        else
          $LUAROCKS lua-zip
          $LUAROCKS LuaSQL-SQLite3 2.6.1
          $LUAROCKS lrexlib-pcre
        fi

        $LUAROCKS argparse
        $LUAROCKS lunajson
        $LUAROCKS busted

        if [ "${RUNNER_OS}" = "Linux" ]; then
          sudo apt-get install libgstreamer-plugins-base1.0-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 xvfb libfuse2 -y
        fi
      env:
        BUILD_FOLDER: ${{runner.workspace}}/b/ninja
        RUNNER_OS: ${{runner.os}}
        DEPLOY: ${{matrix.deploy}}

    - name: add ssh-agent for release uploads
      if: (runner.os == 'Linux' || runner.os == 'macOS') && matrix.deploy == 'deploy' && startsWith(github.ref, 'refs/tags/Mudlet-')
      uses: webfactory/ssh-agent@v0.9.1
      with:
        ssh-private-key: ${{secrets.UPLOAD_PRIVATEKEY}}

    - name: package Mudlet
      if: (runner.os == 'Linux' || runner.os == 'macOS') && matrix.deploy == 'deploy'
      run: |
        if [ "$RUNNER_OS" = "macOS" ]; then
          if [ "$(uname -m)" = "arm64" ]; then
            YAJL_LIB_PATH=/opt/homebrew/opt/yajl/lib/libyajl.2.dylib
          else
            YAJL_LIB_PATH=/usr/local/opt/yajl/lib/libyajl.2.dylib
          fi
          FAKE_VCPKG_DIR=${{runner.workspace}}/vcpkg_yajl
          mkdir -p "$FAKE_VCPKG_DIR/packages/yajl_${{matrix.triplet}}/lib"
          ln -s "$YAJL_LIB_PATH" "$FAKE_VCPKG_DIR/packages/yajl_${{matrix.triplet}}/lib/libyajl.2.dylib"
          export VCPKG_ROOT=$FAKE_VCPKG_DIR
        fi

        export ARCH=$(uname -m)
        echo "ARCH=$ARCH" >> $GITHUB_ENV

        if [ "$RUNNER_OS" = "macOS" ] && [ "$ARCH" = "arm64" ]; then
          export ARCH_DBLSQD=arm
          echo "ARCH_DBLSQD=arm" >> $GITHUB_ENV
        else
          export ARCH_DBLSQD=$ARCH
          echo "ARCH_DBLSQD=$ARCH" >> $GITHUB_ENV
        fi

        ${{github.workspace}}/CI/travis.after_success.sh
      env:
        BUILD_FOLDER: ${{runner.workspace}}/b/ninja
        RUNNER_OS: ${{runner.os}}
        X_WP_DOWNLOAD_TOKEN: ${{secrets.X_WP_DOWNLOAD_TOKEN}}
        DEPLOY: ${{matrix.deploy}}
        DEPLOY_PATH: ${{secrets.DEPLOY_PATH}}
        DBLSQD_USER: ${{secrets.DBLSQD_USER}}
        DBLSQD_PASS: ${{secrets.DBLSQD_PASS}}
        DEPLOY_KEY_PASS: ${{secrets.DEPLOY_KEY_PASS}}
        MACOS_SIGNING_PASS: ${{secrets.MACOS_SIGNING_PASS}}
        APPLE_USERNAME: ${{secrets.APPLE_USERNAME}}
        APPLE_PASSWORD: ${{secrets.APPLE_PASSWORD}}
        APPLE_TEAM_ID: ${{secrets.APPLE_TEAM_ID}}

    - name: Upload debug symbols and source to sentry.io
      if: env.WITH_SENTRY == 'yes'
      env:
        SENTRY_AUTH_TOKEN: ${{secrets.SENTRY_AUTH_TOKEN}}
      run: |
        if [ -z "$SENTRY_AUTH_TOKEN" ]; then
          echo "No SENTRY_AUTH_TOKEN available, skipping debug symbol upload"
          exit 0
        fi

        sudo pip install --upgrade sentry-cli
        export SENTRY_ORG=mudlet
        export SENTRY_PROJECT=mudlet
        export SENTRY_VERSION=${{env.VERSION}}${{env.MUDLET_VERSION_BUILD}}

        sentry-cli releases new $SENTRY_VERSION
        sentry-cli releases set-commits $SENTRY_VERSION --auto
        sentry-cli releases finalize $SENTRY_VERSION

        if [ "$RUNNER_OS" = "macOS" ]; then
          if [ -d "${{runner.workspace}}/b/ninja/${{env.UPLOAD_FILENAME}}.app" ]; then
            MUDLET_BINARY="${{runner.workspace}}/b/ninja/${{env.UPLOAD_FILENAME}}.app"
          elif [ -d "${{runner.workspace}}/b/ninja/Mudlet PTB.app" ]; then
            MUDLET_BINARY="${{runner.workspace}}/b/ninja/Mudlet PTB.app"
          else
            MUDLET_BINARY="${{runner.workspace}}/b/ninja/src/mudlet.app"
          fi
          sentry-cli debug-files upload --include-sources --wait "$MUDLET_BINARY" $(find ~/.luarocks -name "*.dylib" -o -name "*.so")
        else
          sentry-cli debug-files upload --include-sources --wait ${{runner.workspace}}/b/ninja/src/mudlet $(find ~/.luarocks -name "*.so")
        fi

    - name: Upload packaged Mudlet
      uses: actions/upload-artifact@v5
      if: env.UPLOAD_FILENAME
      with:
        name: ${{env.UPLOAD_FILENAME}}
        path: ${{env.FOLDER_TO_UPLOAD}}

    - name: Submit to make.mudlet.org
      if: env.UPLOAD_FILENAME
      run: curl --retry 5 -X POST "https://make.mudlet.org/snapshots/gha_queue.php?artifact_name=${{env.UPLOAD_FILENAME}}&unzip=1"

    - name: (Linux) Prep binary for running tests
      if: matrix.run_tests == 'true' && runner.os =='Linux'
      run: |
        cp ${{runner.workspace}}/b/ninja/src/mudlet ${{github.workspace}}/src
        if [ "${{matrix.deploy}}" == "deploy" ]; then
          cp -f ${{runner.workspace}}/b/ninja/src/crashpad_handler ${{github.workspace}}/src
        fi

    - name: (macOS) Prep binary for running tests
      if: matrix.run_tests == 'true' && runner.os == 'macOS'
      run: |
        if [ -d "${{runner.workspace}}/b/ninja/${{env.UPLOAD_FILENAME}}.app" ]; then
          cp -r ${{runner.workspace}}/b/ninja/${{env.UPLOAD_FILENAME}}.app ~/Desktop/Mudlet.app
        elif [ -d "${{runner.workspace}}/b/ninja/Mudlet PTB.app" ]; then
          cp -r "${{runner.workspace}}/b/ninja/Mudlet PTB.app" ~/Desktop/Mudlet.app
        else
          cp -r ${{runner.workspace}}/b/ninja/src/mudlet.app ~/Desktop/Mudlet.app
        fi
        cd ~/Desktop
        sudo codesign --remove-signature ~/Desktop/Mudlet.app

    - name: (Linux) Run Lua tests
      if: matrix.run_tests == 'true' && runner.os == 'Linux'
      timeout-minutes: 5
      run: xvfb-run --auto-servernum ${{github.workspace}}/src/mudlet --profile "Mudlet self-test" --mirror
      env:
        AUTORUN_BUSTED_TESTS: 'true'
        TESTS_DIRECTORY: ${{github.workspace}}/src/mudlet-lua/tests
        QUIT_MUDLET_AFTER_TESTS: 'true'

    - name: (macOS) Run Lua tests
      if: matrix.run_tests == 'true' && runner.os == 'macOS'
      timeout-minutes: 5
      run: ~/Desktop/Mudlet.app/Contents/MacOS/mudlet --profile "Mudlet self-test" --mirror
      env:
        AUTORUN_BUSTED_TESTS: 'true'
        TESTS_DIRECTORY: ${{github.workspace}}/src/mudlet-lua/tests
        QUIT_MUDLET_AFTER_TESTS: 'true'

    - name: Passed Lua tests
      if: matrix.run_tests == 'true'
      run: |
        if [ -e /tmp/busted-tests-failed ]
        then
          echo "Lua tests failed - see the action called 'Run Lua tests' above for detailed output."
          exit 1
        fi

# DUPLICATE WORKFLOW: This file is paired with build-mudlet-pr.yml
# Changes here likely need to be mirrored there as well.
name: 🔨 Build Mudlet
on:
  push:
    branches: [master, development, release-*]
    tags: [Mudlet-*]
  workflow_dispatch:
    inputs:
      scheduled:
        description: 'Imitate a PTB'
        required: false
        default: 'false'
  schedule:
    - cron: '0 2 * * *'

jobs:
  compile-mudlet:
    name: ${{matrix.buildname}}
    runs-on: ${{matrix.os}}
    if: ${{ github.repository_owner == 'Mudlet' }}
    env:
      LUA_VERSION: '5.1.5'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Note: using / in the "buildname" has significance - replacing the
          # ',' in some of the following with a '/' seemed to cause extra
          # spurious steps in the build and broke things! - SlySven
          # oldest OS supported for maximum compatibility of built AppImage
          - os: ubuntu-22.04
            buildname: 'ubuntu / gcc / lua tests + leak detection'
            compiler: gcc_64
            gcc_compiler_version: 10
            qt: '6.9.0'
            deploy: 'deploy'
            run_tests: 'true'
            # Enable AddressSanitizer for PTB and testing builds, but not release
            # builds (tagged Mudlet-*) - ASAN adds significant runtime overhead
            enable_asan: 'true'
          - os: ubuntu-22.04
            # Another try to use GCC12
            buildname: 'ubuntu (x86_64)'
            compiler: gcc_64
            gcc_compiler_version: 12
            qt: '6.9.0'
          - os: ubuntu-latest
            buildname: 'ubuntu / clang'
            compiler: clang_64
            gcc_compiler_version: 10
            qt: '6.9.0'
          - os: macos-15-intel
            buildname: 'macos (x86_64) / c++, lua tests'
            compiler: clang_64
            qt: '6.9.0'
            deploy: 'deploy'
            run_tests: 'true'
          - os: macos-14
            buildname: 'macos (arm64) / c++, lua tests'
            compiler: clang_64
            qt: '6.9.0'
            deploy: 'deploy'
            run_tests: 'true'

    steps:
    - name: Checkout Mudlet source code
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{matrix.qt}}
        dir: ${{runner.workspace}}
        cache: true
        modules: qt5compat qtmultimedia qtspeech

    - name: Use CMake 3.30.3
      uses: lukka/get-cmake@v4.3.4

    - name: (macOS) Install Lua via GitHub Actions
      if: runner.os == 'macOS'
      uses: leafo/gh-actions-lua@v13
      with:
        luaVersion: ${{ env.LUA_VERSION }}
        buildCache: false

    - name: (macOS) Install Luarocks via GitHub Actions
      if: runner.os == 'macOS'
      uses: leafo/gh-actions-luarocks@v6

    - name: (macOS) Install dependencies
      if: runner.os == 'macOS'
      env:
        HOMEBREW_NO_ANALYTICS: "ON"
        HOMEBREW_NO_AUTO_UPDATE: "ON"
        HOMEBREW_NO_BOTTLE_SOURCE_FALLBACK: "ON"
        HOMEBREW_NO_INSTALL_CLEANUP: "ON"
      timeout-minutes: 7
      run: |
        # Remove Homebrew LLVM to prevent it from shadowing AppleClang.
        # Upstream LLVM can't compile Objective-C++ against Apple SDK headers.
        brew uninstall --ignore-dependencies llvm@15 2>/dev/null || true

        # Install all required dependencies
        # brew install can hang indefinitely during bottle pouring, so timeout and retry
        for attempt in 1 2 3; do
          brew install libzzip libzip ccache expect assimp hunspell oniguruma pcre2 pugixml sqlite yajl boost &
          brew_pid=$!
          ( sleep 120 && kill $brew_pid 2>/dev/null ) &
          watcher_pid=$!
          wait $brew_pid && { kill $watcher_pid 2>/dev/null || true; wait $watcher_pid 2>/dev/null || true; break; }
          kill $watcher_pid 2>/dev/null || true; wait $watcher_pid 2>/dev/null || true
          echo "::warning::brew install attempt $attempt failed or timed out, retrying..."
          if [ "$attempt" -eq 3 ]; then
            echo "::error::brew install failed after 3 attempts"
            exit 1
          fi
        done

        echo "CCACHE_DIR=${{runner.workspace}}/ccache" >> $GITHUB_ENV

        # Use latest available XCode
        echo "DEVELOPER_DIR=$(xcode-select --print-path)" >> $GITHUB_ENV
        echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> $GITHUB_ENV

        # Detect Homebrew prefix once (differs between x86_64 and ARM64)
        if [ "$(uname -m)" = "arm64" ]; then
          HOMEBREW_PREFIX=/opt/homebrew
        else
          HOMEBREW_PREFIX=/usr/local
        fi
        echo "HOMEBREW_PREFIX=$HOMEBREW_PREFIX" >> $GITHUB_ENV

        # Set CMAKE_PREFIX_PATH to include both Qt and Homebrew directories
        # Qt is installed by install-qt-action, Homebrew has qtkeychain
        # Use : as separator (Unix) not ; (Windows)
        echo "CMAKE_PREFIX_PATH=${QT_ROOT_DIR}:${HOMEBREW_PREFIX}" >> $GITHUB_ENV

        # Help CMake find Lua installed by gh-actions-lua
        # The action installs to .lua/ and .luarocks/ in the runner home
        echo "LUA_DIR=$HOME/.lua" >> $GITHUB_ENV

        # Help CMake find keg-only Homebrew packages (PCRE2 is keg-only on macOS)
        echo "PKG_CONFIG_PATH=${HOMEBREW_PREFIX}/opt/pcre2/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

        # Install lua-yajl early to generate translation statistics
        luarocks --lua-version 5.1 install --local lua-yajl YAJL_DIR=${HOMEBREW_PREFIX}/opt/yajl

        # Allow stats generation script to see location of lua-yajl
        eval "$(luarocks path --local --lua-version "5.1")"
        echo "LUA_PATH=$LUA_PATH" >> $GITHUB_ENV
        echo "LUA_CPATH=$LUA_CPATH" >> $GITHUB_ENV

    - name: (Linux) Install Lua via GitHub Actions
      uses: leafo/gh-actions-lua@v13
      if: runner.os == 'Linux'
      with:
        luaVersion: ${{ env.LUA_VERSION }}
        buildCache: false

    - name: (Linux) Install Luarocks via GitHub Actions
      uses: leafo/gh-actions-luarocks@v6
      if: runner.os == 'Linux'

    - name: (Linux) Install dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update

        # Install all required dependencies
        # imagemagick is for the desktop screenshot
        # liblua5.1-0-dev is needed for CMake to find Lua headers/library
        sudo apt-get install \
          ccache \
          expect \
          g++-${{matrix.gcc_compiler_version}} \
          imagemagick \
          libassimp-dev \
          libboost-dev \
          libcurl4-openssl-dev \
          libglu1-mesa-dev \
          libhunspell-dev \
          liblua5.1-0-dev \
          libonig-dev \
          libpcre2-dev \
          libpulse-dev \
          libpugixml-dev \
          libsecret-1-dev \
          libspeechd-dev \
          libsqlite3-dev \
          libssl-dev \
          libxkbcommon-x11-0 \
          libxcb-render-util0-dev \
          libxcb-image0-dev \
          libyajl-dev \
          libzip-dev \
          qtkeychain-qt6-dev \
          pcre2-utils \
          pkg-config \
          openssl \
          ca-certificates \
          -y

        # switch to GCC that supports C++20 while retaining support for older OS's
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${{matrix.gcc_compiler_version}} ${{matrix.gcc_compiler_version}}
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-${{matrix.gcc_compiler_version}} ${{matrix.gcc_compiler_version}}
        sudo update-alternatives --set gcc /usr/bin/gcc-${{matrix.gcc_compiler_version}}
        sudo update-alternatives --set g++ /usr/bin/g++-${{matrix.gcc_compiler_version}}

        echo "CCACHE_DIR=${{runner.workspace}}/ccache" >> $GITHUB_ENV

        # Install lua-yajl early to generate translation statistics
        luarocks --lua-version 5.1 install --local lua-yajl

        # Allow stats generation script to see location of lua-yajl
        eval "$(luarocks path --local --lua-version "5.1")"
        echo "LUA_PATH=$LUA_PATH" >> $GITHUB_ENV
        echo "LUA_CPATH=$LUA_CPATH" >> $GITHUB_ENV

    - name: (Linux) Build xcb-util-cursor 0.1.5
      timeout-minutes: 5
      if: runner.os == 'Linux'
      run: |
        # Download and extract xcb-util-cursor 0.1.5
        # This version fixes the off-by-one heap buffer overflow in _XcursorThemeInherits
        # that causes PTB builds to crash with AddressSanitizer
        wget -q --connect-timeout=10 --read-timeout=30 --tries=3 --waitretry=5 https://xorg.freedesktop.org/archive/individual/lib/xcb-util-cursor-0.1.5.tar.xz
        tar xf xcb-util-cursor-0.1.5.tar.xz
        cd xcb-util-cursor-0.1.5

        # Configure and build
        ./configure --prefix=/usr --libdir=/usr/lib/x86_64-linux-gnu
        make -j$(nproc)

        # Install system-wide (replaces Ubuntu 22.04's buggy 0.1.1)
        sudo make install

        # Update library cache so linker finds new version
        sudo ldconfig

    - name: (Linux Clang) change compiler & disable optional components
      if: runner.os == 'Linux' && matrix.compiler == 'clang_64'
      run: |
         echo "CXX=clang++" >> $GITHUB_ENV
         echo "CC=clang" >> $GITHUB_ENV
         echo "WITH_UPDATER=no" >> $GITHUB_ENV
         echo "WITH_3DMAPPER=no" >> $GITHUB_ENV
         echo "WITH_FONTS=no" >> $GITHUB_ENV

    - name: Restore ccache
      id: restore-ccache
      uses: actions/cache/restore@v6
      with:
        path: ${{runner.workspace}}/ccache
        key: ccache-${{matrix.os}}-${{runner.arch}}-${{matrix.compiler}}${{matrix.gcc_compiler_version != '' && format('v{0}', matrix.gcc_compiler_version) || ''}}-${{matrix.qt}}-${{ github.ref_name }}
        restore-keys: ccache-${{matrix.os}}-${{runner.arch}}-${{matrix.compiler}}${{matrix.gcc_compiler_version != '' && format('v{0}', matrix.gcc_compiler_version) || ''}}-${{matrix.qt}}-development

    - name: (Linux) Set build info
      if: runner.os == 'Linux'
      env:
        GITHUB_EVENT_INPUTS_SCHEDULED: ${{inputs.scheduled}}
      run: |
        sudo apt-get -y install pcre2-utils
        ${{github.workspace}}/CI/validate_deployment.sh
        ${{github.workspace}}/CI/set-build-info.sh

    - name: (macOS) Set build info
      if: runner.os == 'macOS'
      env:
        GITHUB_EVENT_INPUTS_SCHEDULED: ${{inputs.scheduled}}
      run: |
        brew install pcre2
        ${{github.workspace}}/CI/validate_deployment.sh
        ${{github.workspace}}/CI/set-build-info.sh
        # ccache can't reliably detect that the compiler is clang on macOS, so just say so explicitly.
        echo "CXX=clang++" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV

    - name: check ccache stats prior to build
      run: ccache --zero-stats --show-stats

    - name: Get sentry-native commit hash
      id: sentry-hash
      run: echo "SENTRY_HASH=$(git -C 3rdparty/sentry-native rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Cache sentry-native
      id: cache-sentry
      uses: actions/cache@v6
      with:
        path: |
          3rdparty/sentry-native/install_without_transport
          3rdparty/sentry-native/install_with_transport
        key: sentry-${{ runner.os }}-${{ runner.arch }}-${{ steps.sentry-hash.outputs.SENTRY_HASH }}

    - name: Build Mudlet
      uses: lukka/run-cmake@v3
      with:
        cmakeListsOrSettingsJson: CMakeListsTxtAdvanced
        cmakeListsTxtPath: '${{github.workspace}}/CMakeLists.txt'
        buildDirectory: '${{runner.workspace}}/b/ninja'
        cmakeAppendedArgs: >-
          -G Ninja
          -DCMAKE_PREFIX_PATH=${{ env.CMAKE_PREFIX_PATH != '' && env.CMAKE_PREFIX_PATH || (env.QT_PREFIX != '' && env.QT_PREFIX || env.MINGW_BASE_DIR) }}
          -DUSE_SANITIZER=${{ matrix.enable_asan == 'true' && !startsWith(github.ref, 'refs/tags/Mudlet-') && 'Address' || '' }}
          ${{ runner.os == 'macOS' && format('-DLUA_INCLUDE_DIR={0}/.lua/include -DLUA_LIBRARY={0}/.lua/lib/liblua.a', github.workspace) || '' }}
          -DWITH_SENTRY=ON
          -DSENTRY_SEND_DEBUG=${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule' || github.event.inputs.scheduled == 'true') && '1' || '0' }}
          -DSENTRY_DSN=${{ secrets.SENTRY_DSN }}
      env:
        NINJA_STATUS: '[%f/%t %o/sec] '
        MUDLET_SANITIZERS: ${{ github.event_name == 'pull_request' && 'address' || '' }}
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

    - name: Save ccache
      if: always()
      uses: actions/cache/save@v6
      with:
        path: ${{runner.workspace}}/ccache
        key: ${{ steps.restore-ccache.outputs.cache-primary-key }}
  
    - name: check ccache stats post build
      run: ccache --show-stats

    - name: install dependencies for packaging/tests
      run: |
        LUAROCKS="luarocks --lua-version 5.1 install --local"

        $LUAROCKS LuaFileSystem
        $LUAROCKS luautf8
        $LUAROCKS lpeg

        if [ "$RUNNER_OS" = "macOS" ]; then
          $LUAROCKS lua-zip ZIP_DIR=${HOMEBREW_PREFIX}/opt/libzip
          $LUAROCKS LuaSQL-SQLite3 2.6.1 SQLITE_DIR=${HOMEBREW_PREFIX}/opt/sqlite
          $LUAROCKS lrexlib-pcre2 PCRE2_DIR=${HOMEBREW_PREFIX}/opt/pcre2
        else
          $LUAROCKS lua-zip
          $LUAROCKS LuaSQL-SQLite3 2.6.1
          $LUAROCKS lrexlib-pcre2
        fi

        # CI changelog generation dependencies
        $LUAROCKS argparse
        $LUAROCKS lunajson

        # Lua-based tests
        $LUAROCKS busted

        # necessary for Qt multimedia and modern Qt
        # libfuse2 could be needed for linuxdeployqt on Ubuntu 22.04:
        if [ "${RUNNER_OS}" = "Linux" ]; then
          sudo apt-get install libgstreamer-plugins-base1.0-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 xvfb libfuse2 -y
        fi
      env:
        BUILD_FOLDER: ${{runner.workspace}}/b/ninja
        RUNNER_OS: ${{runner.os}}
        DEPLOY: ${{matrix.deploy}}

    - name: (Linux) Run C++ tests
      if: runner.os == 'Linux' && matrix.run_tests == 'true'
      working-directory: '${{runner.workspace}}/b/ninja'
      run: ctest --output-on-failure
      env:
        QT_QPA_PLATFORM: offscreen
        QT_FORCE_STDERR_LOGGING: 1
        ASAN_OPTIONS: ${{ matrix.enable_asan == 'true' && 'detect_leaks=1' || '' }}
        LSAN_OPTIONS: ${{ matrix.enable_asan == 'true' && format('suppressions={0}/asan-suppressions.txt:exitcode=0', github.workspace) || '' }}

    - name: (macOS) Run C++ tests
      if: runner.os == 'macOS'
      working-directory: '${{runner.workspace}}/b/ninja'
      run: ctest --output-on-failure
      env:
        QT_FORCE_STDERR_LOGGING: 1

    - name: add ssh-agent for release uploads
      if: (runner.os == 'Linux' || runner.os == 'macOS') && matrix.deploy == 'deploy' && startsWith(github.ref, 'refs/tags/Mudlet-')
      uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{secrets.UPLOAD_PRIVATEKEY}}

    - name: package Mudlet
      if: (runner.os == 'Linux' || runner.os == 'macOS') && matrix.deploy == 'deploy'
      run: |
        export ARCH=$(uname -m)
        echo "ARCH=$ARCH" >> $GITHUB_ENV
        if [ "$RUNNER_OS" = "macOS" ] && [ "$ARCH" = "arm64" ]; then
          # dblsqd only supports 'arm' as an architecture and not 'arm64'
          export ARCH_DBLSQD=arm
          echo "ARCH_DBLSQD=arm" >> $GITHUB_ENV
        else
          export ARCH_DBLSQD=$ARCH
          echo "ARCH_DBLSQD=$ARCH" >> $GITHUB_ENV
        fi
        ${{github.workspace}}/CI/after_success.sh
      env:
        BUILD_FOLDER: ${{runner.workspace}}/b/ninja
        RUNNER_OS: ${{runner.os}}
        X_WP_DOWNLOAD_TOKEN: ${{secrets.X_WP_DOWNLOAD_TOKEN}}
        DEPLOY: ${{matrix.deploy}}
        DEPLOY_PATH: ${{secrets.DEPLOY_PATH}}
        DBLSQD_USER: ${{secrets.DBLSQD_USER}}
        DBLSQD_PASS: ${{secrets.DBLSQD_PASS}}
        DEPLOY_KEY_PASS: ${{secrets.DEPLOY_KEY_PASS}}
        MACOS_SIGNING_PASS: ${{secrets.MACOS_SIGNING_PASS}}
        APPLE_USERNAME: ${{secrets.APPLE_USERNAME}}
        APPLE_PASSWORD: ${{secrets.APPLE_PASSWORD}}
        APPLE_TEAM_ID: ${{secrets.APPLE_TEAM_ID}}
        WITH_SENTRY: "ON"
        GITHUB_FORCE_BUILD: ${{ github.event.inputs.scheduled == 'true' }}
        # needed so CI/*.after_success.sh can query existing releases to skip duplicate PTBs
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload packaged Mudlet
      uses: actions/upload-artifact@v7
      if: env.UPLOAD_FILENAME
      with:
        name: ${{env.UPLOAD_FILENAME}}
        path: ${{env.FOLDER_TO_UPLOAD}}

    - name: Submit to make.mudlet.org
      if: env.UPLOAD_FILENAME
      run: curl --retry 5 -X POST "https://make.mudlet.org/snapshots/gha_queue.php?artifact_name=${{env.UPLOAD_FILENAME}}&unzip=1"
      shell: bash

    - name: Upload release asset for GitHub Release
      uses: actions/upload-artifact@v7
      if: env.RELEASE_ASSET_PATH
      with:
        name: release-asset-${{ runner.os }}-${{ runner.arch }}
        path: |
          ${{ env.RELEASE_ASSET_PATH }}
          ${{ env.RELEASE_ASSET_SHA256_PATH }}
        retention-days: 3

    - name: Export release metadata
      if: env.RELEASE_ASSET_PATH
      shell: bash
      run: |
        jq -n \
          --arg version "${VERSION}" \
          --arg build_suffix "${MUDLET_VERSION_BUILD}" \
          --arg commit "${BUILD_COMMIT}" \
          --arg ref "${{ github.ref }}" \
          --arg event "${{ github.event_name }}" \
          '{version: $version, build_suffix: $build_suffix, commit: $commit, ref: $ref, event: $event}' \
          > release-metadata.json

    - name: Upload release metadata
      uses: actions/upload-artifact@v7
      if: env.RELEASE_ASSET_PATH
      with:
        name: release-metadata-${{ runner.os }}-${{ runner.arch }}
        path: release-metadata.json
        retention-days: 3

    # we need to be in the right place for LuaGlobals.lua to load
    - name: (Linux) Prep binary for running tests
      if: matrix.run_tests == 'true' && runner.os =='Linux'
      run: cp ${{runner.workspace}}/b/ninja/src/mudlet ${{github.workspace}}/src

    - name: (macOS) Prep binary for running tests
      if: matrix.run_tests == 'true' && runner.os == 'macOS'
      run: |
        if [ -d "${{runner.workspace}}/b/ninja/${{env.UPLOAD_FILENAME}}.app" ]; then
          cp -r ${{runner.workspace}}/b/ninja/${{env.UPLOAD_FILENAME}}.app ~/Desktop/Mudlet.app
        elif [ -d "${{runner.workspace}}/b/ninja/Mudlet PTB.app" ]; then
          cp -r "${{runner.workspace}}/b/ninja/Mudlet PTB.app" ~/Desktop/Mudlet.app
        else
          cp -r ${{runner.workspace}}/b/ninja/src/mudlet.app ~/Desktop/Mudlet.app
        fi
        cd ~/Desktop
        sudo codesign --remove-signature ~/Desktop/Mudlet.app

    - name: (Linux) Run Lua tests
      if: matrix.run_tests == 'true' && runner.os == 'Linux'
      timeout-minutes: 1
      run: xvfb-run --auto-servernum ${{github.workspace}}/src/mudlet --profile "Mudlet self-test" --mirror
      env:
        AUTORUN_BUSTED_TESTS: 'true'
        MUDLET_TEST_MODE: 1
        TESTS_DIRECTORY: ${{github.workspace}}/src/mudlet-lua/tests
        QUIT_MUDLET_AFTER_TESTS: 'true'
        ASAN_OPTIONS: ${{ matrix.enable_asan == 'true' && 'detect_leaks=1' || '' }}
        LSAN_OPTIONS: ${{ matrix.enable_asan == 'true' && format('suppressions={0}/asan-suppressions.txt:exitcode=0', github.workspace) || '' }}

    - name: (macOS) Run Lua tests
      if: matrix.run_tests == 'true' && runner.os == 'macOS'
      timeout-minutes: 1
      run: ~/Desktop/Mudlet.app/Contents/MacOS/mudlet --profile "Mudlet self-test" --mirror
      env:
        AUTORUN_BUSTED_TESTS: 'true'
        MUDLET_TEST_MODE: 1
        TESTS_DIRECTORY: ${{github.workspace}}/src/mudlet-lua/tests
        QUIT_MUDLET_AFTER_TESTS: 'true'
        ASAN_OPTIONS: detect_leaks=0

    - name: Passed Lua tests
      if: matrix.run_tests == 'true'
      run: |
        if [ -e /tmp/busted-tests-failed ]
        then
          echo "Lua tests failed - see the action called 'Run Lua tests' above for detailed output."
          exit 1
        fi

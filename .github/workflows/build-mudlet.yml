# DUPLICATE WORKFLOW: This file is paired with build-mudlet-pr.yml
# Changes here likely need to be mirrored there as well.
name: 🔨 Build Mudlet
on:
  push:
    branches: [master, development, release-*]
    tags: [Mudlet-*]
  workflow_dispatch:
    inputs:
      scheduled:
        description: 'Imitate a PTB'
        required: false
        default: 'false'
      # The four inputs below drive the debugging harness for issue #9670,
      # "Mudlet stops responding on macOS part way through the package specs,
      # after a burst of profile saves". They only do anything on a hand-made
      # dispatch with the first one ticked; a push, a schedule or an untouched
      # dispatch behaves exactly as it always has.
      debug_macos_hang:
        description: 'Debug #9670 instead of building: run the macOS package specs with their pending gate lifted, under a watchdog that captures the stacks if they hang'
        type: boolean
        default: false
      debug_runner:
        description: '#9670: which macOS runner(s) to try to reproduce on'
        type: choice
        default: 'macos-14'
        options:
          - 'macos-14'
          - 'macos-15-intel'
          - 'both'
      debug_tmate:
        description: '#9670: start a detached tmate session before the specs, so the hang can be poked at live. SSH is restricted to whoever dispatched this.'
        type: boolean
        default: false
      debug_hold_minutes:
        description: '#9670: keep the hung process alive this long after its stacks are captured. macOS runner minutes bill at 10x, so leave this at 0 unless you are about to attach over tmate.'
        type: choice
        default: '0'
        options:
          - '0'
          - '5'
          - '15'
          - '30'
  schedule:
    - cron: '0 2 * * *'

jobs:
  compile-mudlet:
    name: ${{matrix.buildname}}
    runs-on: ${{matrix.os}}
    # A dispatch that asked for the #9670 debugging harness wants that and
    # nothing else - building and deploying all five legs alongside it would
    # burn runner minutes and submit a build to make.mudlet.org for no reason.
    # On every other event the inputs context is empty, so this reads as it
    # always did.
    if: ${{ github.repository_owner == 'Mudlet' && !inputs.debug_macos_hang }}
    env:
      LUA_VERSION: '5.1.5'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Note: using / in the "buildname" has significance - replacing the
          # ',' in some of the following with a '/' seemed to cause extra
          # spurious steps in the build and broke things! - SlySven
          # oldest OS supported for maximum compatibility of built AppImage
          - os: ubuntu-22.04
            buildname: 'ubuntu / gcc / lua tests + leak detection'
            compiler: gcc_64
            gcc_compiler_version: 10
            qt: '6.9.0'
            deploy: 'deploy'
            run_tests: 'true'
            # Enable AddressSanitizer for PTB and testing builds, but not release
            # builds (tagged Mudlet-*) - ASAN adds significant runtime overhead
            enable_asan: 'true'
          - os: ubuntu-22.04
            # Another try to use GCC12
            buildname: 'ubuntu (x86_64)'
            compiler: gcc_64
            gcc_compiler_version: 12
            qt: '6.9.0'
          - os: ubuntu-latest
            buildname: 'ubuntu / clang'
            compiler: clang_64
            gcc_compiler_version: 10
            qt: '6.9.0'
          - os: macos-15-intel
            buildname: 'macos (x86_64) / c++, lua tests'
            compiler: clang_64
            qt: '6.9.0'
            deploy: 'deploy'
            run_tests: 'true'
          - os: macos-14
            buildname: 'macos (arm64) / c++, lua tests'
            compiler: clang_64
            qt: '6.9.0'
            deploy: 'deploy'
            run_tests: 'true'

    steps:
    - name: Checkout Mudlet source code
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{matrix.qt}}
        dir: ${{runner.workspace}}
        cache: true
        modules: qt5compat qtmultimedia qtspeech

    - name: Use CMake 3.30.3
      uses: lukka/get-cmake@v4.4.0

    - name: (macOS) Install Lua via GitHub Actions
      if: runner.os == 'macOS'
      uses: leafo/gh-actions-lua@v13
      with:
        luaVersion: ${{ env.LUA_VERSION }}
        buildCache: false

    - name: (macOS) Install Luarocks via GitHub Actions
      if: runner.os == 'macOS'
      uses: leafo/gh-actions-luarocks@v6

    - name: (macOS) Install dependencies
      if: runner.os == 'macOS'
      env:
        HOMEBREW_NO_ANALYTICS: "ON"
        HOMEBREW_NO_AUTO_UPDATE: "ON"
        HOMEBREW_NO_BOTTLE_SOURCE_FALLBACK: "ON"
        HOMEBREW_NO_INSTALL_CLEANUP: "ON"
      timeout-minutes: 7
      run: |
        # Remove Homebrew LLVM to prevent it from shadowing AppleClang.
        # Upstream LLVM can't compile Objective-C++ against Apple SDK headers.
        brew uninstall --ignore-dependencies llvm@15 2>/dev/null || true

        # Install all required dependencies
        # brew install can hang indefinitely during bottle pouring, so timeout and retry
        for attempt in 1 2 3; do
          brew install libzzip libzip ccache expect assimp hunspell oniguruma pcre2 pugixml sqlite yajl boost &
          brew_pid=$!
          ( sleep 120 && kill $brew_pid 2>/dev/null ) &
          watcher_pid=$!
          wait $brew_pid && { kill $watcher_pid 2>/dev/null || true; wait $watcher_pid 2>/dev/null || true; break; }
          kill $watcher_pid 2>/dev/null || true; wait $watcher_pid 2>/dev/null || true
          echo "::warning::brew install attempt $attempt failed or timed out, retrying..."
          if [ "$attempt" -eq 3 ]; then
            echo "::error::brew install failed after 3 attempts"
            exit 1
          fi
        done

        echo "CCACHE_DIR=${{runner.workspace}}/ccache" >> $GITHUB_ENV

        # Use latest available XCode
        echo "DEVELOPER_DIR=$(xcode-select --print-path)" >> $GITHUB_ENV
        echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> $GITHUB_ENV

        # Detect Homebrew prefix once (differs between x86_64 and ARM64)
        if [ "$(uname -m)" = "arm64" ]; then
          HOMEBREW_PREFIX=/opt/homebrew
        else
          HOMEBREW_PREFIX=/usr/local
        fi
        echo "HOMEBREW_PREFIX=$HOMEBREW_PREFIX" >> $GITHUB_ENV

        # Set CMAKE_PREFIX_PATH to include both Qt and Homebrew directories
        # Qt is installed by install-qt-action, Homebrew has qtkeychain
        # Use : as separator (Unix) not ; (Windows)
        echo "CMAKE_PREFIX_PATH=${QT_ROOT_DIR}:${HOMEBREW_PREFIX}" >> $GITHUB_ENV

        # Help CMake find Lua installed by gh-actions-lua
        # The action installs to .lua/ and .luarocks/ in the runner home
        echo "LUA_DIR=$HOME/.lua" >> $GITHUB_ENV

        # Help CMake find keg-only Homebrew packages (PCRE2 is keg-only on macOS)
        echo "PKG_CONFIG_PATH=${HOMEBREW_PREFIX}/opt/pcre2/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

        # Install lua-yajl early to generate translation statistics
        luarocks --lua-version 5.1 install --local lua-yajl YAJL_DIR=${HOMEBREW_PREFIX}/opt/yajl

        # Allow stats generation script to see location of lua-yajl
        eval "$(luarocks path --local --lua-version "5.1")"
        echo "LUA_PATH=$LUA_PATH" >> $GITHUB_ENV
        echo "LUA_CPATH=$LUA_CPATH" >> $GITHUB_ENV

    - name: (Linux) Install Lua via GitHub Actions
      uses: leafo/gh-actions-lua@v13
      if: runner.os == 'Linux'
      with:
        luaVersion: ${{ env.LUA_VERSION }}
        buildCache: false

    - name: (Linux) Install Luarocks via GitHub Actions
      uses: leafo/gh-actions-luarocks@v6
      if: runner.os == 'Linux'

    - name: (Linux) Install dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update

        # Install all required dependencies
        # imagemagick is for the desktop screenshot
        # liblua5.1-0-dev is needed for CMake to find Lua headers/library
        sudo apt-get install \
          ccache \
          expect \
          g++-${{matrix.gcc_compiler_version}} \
          imagemagick \
          libassimp-dev \
          libboost-dev \
          libcurl4-openssl-dev \
          libglu1-mesa-dev \
          libhunspell-dev \
          liblua5.1-0-dev \
          libonig-dev \
          libpcre2-dev \
          libpulse-dev \
          libpugixml-dev \
          libsecret-1-dev \
          libspeechd-dev \
          libsqlite3-dev \
          libssl-dev \
          libxkbcommon-x11-0 \
          libxcb-render-util0-dev \
          libxcb-image0-dev \
          libyajl-dev \
          libzip-dev \
          qtkeychain-qt6-dev \
          pcre2-utils \
          pkg-config \
          openssl \
          ca-certificates \
          -y

        # switch to GCC that supports C++20 while retaining support for older OS's
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${{matrix.gcc_compiler_version}} ${{matrix.gcc_compiler_version}}
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-${{matrix.gcc_compiler_version}} ${{matrix.gcc_compiler_version}}
        sudo update-alternatives --set gcc /usr/bin/gcc-${{matrix.gcc_compiler_version}}
        sudo update-alternatives --set g++ /usr/bin/g++-${{matrix.gcc_compiler_version}}

        echo "CCACHE_DIR=${{runner.workspace}}/ccache" >> $GITHUB_ENV

        # Install lua-yajl early to generate translation statistics
        luarocks --lua-version 5.1 install --local lua-yajl

        # Allow stats generation script to see location of lua-yajl
        eval "$(luarocks path --local --lua-version "5.1")"
        echo "LUA_PATH=$LUA_PATH" >> $GITHUB_ENV
        echo "LUA_CPATH=$LUA_CPATH" >> $GITHUB_ENV

    - name: (Linux) Cache xcb-util-cursor 0.1.5
      id: cache-xcb-cursor
      if: runner.os == 'Linux'
      uses: actions/cache@v6
      with:
        path: ${{runner.workspace}}/xcb-util-cursor-stage
        key: xcb-util-cursor-0.1.5-${{matrix.os}}-${{runner.arch}}

    - name: (Linux) Build xcb-util-cursor 0.1.5
      timeout-minutes: 5
      if: runner.os == 'Linux' && steps.cache-xcb-cursor.outputs.cache-hit != 'true'
      run: |
        # This version fixes the off-by-one heap buffer overflow in _XcursorThemeInherits
        # that causes PTB builds to crash with AddressSanitizer
        # Several mirrors, each retried: xorg.freedesktop.org served an expired
        # TLS certificate on 2026-07-28, breaking every CI run
        for url in \
          https://xorg.freedesktop.org/archive/individual/lib/xcb-util-cursor-0.1.5.tar.xz \
          https://www.x.org/releases/individual/lib/xcb-util-cursor-0.1.5.tar.xz \
          https://xcb.freedesktop.org/dist/xcb-util-cursor-0.1.5.tar.xz
        do
          for attempt in 1 2 3; do
            if wget -q --connect-timeout=10 --read-timeout=30 --tries=3 --waitretry=5 -O xcb-util-cursor-0.1.5.tar.xz "$url"; then
              break 2
            fi
            echo "::warning::download attempt $attempt from $url failed, retrying..."
            sleep $((attempt * 5))
          done
        done
        # Checksum from https://lists.x.org/archives/xorg-announce/2023-October/003428.html
        # also fails the step if every mirror was unreachable
        echo "0caf99b0d60970f81ce41c7ba694e5eaaf833227bb2cbcdb2f6dc9666a663c57  xcb-util-cursor-0.1.5.tar.xz" | sha256sum -c
        tar xf xcb-util-cursor-0.1.5.tar.xz
        cd xcb-util-cursor-0.1.5

        # Configure and build
        ./configure --prefix=/usr --libdir=/usr/lib/x86_64-linux-gnu
        make -j$(nproc)

        # staged rather than installed directly so the result can be cached
        make DESTDIR="${{runner.workspace}}/xcb-util-cursor-stage" install

    - name: (Linux) Install xcb-util-cursor 0.1.5
      if: runner.os == 'Linux'
      run: |
        # Install system-wide (replaces Ubuntu 22.04's buggy 0.1.1)
        sudo cp -a "${{runner.workspace}}/xcb-util-cursor-stage/." /

        # Update library cache so linker finds new version
        sudo ldconfig

    - name: (Linux Clang) change compiler & disable optional components
      if: runner.os == 'Linux' && matrix.compiler == 'clang_64'
      run: |
         echo "CXX=clang++" >> $GITHUB_ENV
         echo "CC=clang" >> $GITHUB_ENV
         echo "WITH_UPDATER=no" >> $GITHUB_ENV
         echo "WITH_3DMAPPER=no" >> $GITHUB_ENV
         echo "WITH_FONTS=no" >> $GITHUB_ENV

    - name: Restore ccache
      id: restore-ccache
      uses: actions/cache/restore@v6
      with:
        path: ${{runner.workspace}}/ccache
        key: ccache-${{matrix.os}}-${{runner.arch}}-${{matrix.compiler}}${{matrix.gcc_compiler_version != '' && format('v{0}', matrix.gcc_compiler_version) || ''}}-${{matrix.qt}}-${{ github.ref_name }}
        restore-keys: ccache-${{matrix.os}}-${{runner.arch}}-${{matrix.compiler}}${{matrix.gcc_compiler_version != '' && format('v{0}', matrix.gcc_compiler_version) || ''}}-${{matrix.qt}}-development

    - name: (Linux) Set build info
      if: runner.os == 'Linux'
      env:
        GITHUB_EVENT_INPUTS_SCHEDULED: ${{inputs.scheduled}}
      run: |
        sudo apt-get -y install pcre2-utils
        ${{github.workspace}}/CI/validate_deployment.sh
        ${{github.workspace}}/CI/set-build-info.sh

    - name: (macOS) Set build info
      if: runner.os == 'macOS'
      env:
        GITHUB_EVENT_INPUTS_SCHEDULED: ${{inputs.scheduled}}
      run: |
        brew install pcre2
        ${{github.workspace}}/CI/validate_deployment.sh
        ${{github.workspace}}/CI/set-build-info.sh
        # ccache can't reliably detect that the compiler is clang on macOS, so just say so explicitly.
        echo "CXX=clang++" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV

    - name: check ccache stats prior to build
      run: ccache --zero-stats --show-stats

    - name: Get sentry-native commit hash
      id: sentry-hash
      run: echo "SENTRY_HASH=$(git -C 3rdparty/sentry-native rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Cache sentry-native
      id: cache-sentry
      uses: actions/cache@v6
      with:
        path: |
          3rdparty/sentry-native/install_without_transport
          3rdparty/sentry-native/install_with_transport
        key: sentry-${{ runner.os }}-${{ runner.arch }}-${{ steps.sentry-hash.outputs.SENTRY_HASH }}

    - name: Build Mudlet
      uses: lukka/run-cmake@v3
      with:
        cmakeListsOrSettingsJson: CMakeListsTxtAdvanced
        cmakeListsTxtPath: '${{github.workspace}}/CMakeLists.txt'
        buildDirectory: '${{runner.workspace}}/b/ninja'
        cmakeAppendedArgs: >-
          -G Ninja
          -DCMAKE_PREFIX_PATH=${{ env.CMAKE_PREFIX_PATH != '' && env.CMAKE_PREFIX_PATH || (env.QT_PREFIX != '' && env.QT_PREFIX || env.MINGW_BASE_DIR) }}
          -DUSE_SANITIZER=${{ matrix.enable_asan == 'true' && !startsWith(github.ref, 'refs/tags/Mudlet-') && 'Address' || '' }}
          ${{ runner.os == 'macOS' && format('-DLUA_INCLUDE_DIR={0}/.lua/include -DLUA_LIBRARY={0}/.lua/lib/liblua.a', github.workspace) || '' }}
          -DWITH_SENTRY=ON
          -DSENTRY_SEND_DEBUG=${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule' || github.event.inputs.scheduled == 'true') && '1' || '0' }}
          -DSENTRY_DSN=${{ secrets.SENTRY_DSN }}
      env:
        NINJA_STATUS: '[%f/%t %o/sec] '
        MUDLET_SANITIZERS: ${{ github.event_name == 'pull_request' && 'address' || '' }}
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

    - name: Save ccache
      if: always()
      uses: actions/cache/save@v6
      with:
        path: ${{runner.workspace}}/ccache
        key: ${{ steps.restore-ccache.outputs.cache-primary-key }}
  
    - name: check ccache stats post build
      run: ccache --show-stats

    - name: install dependencies for packaging/tests
      run: |
        LUAROCKS="luarocks --lua-version 5.1 install --local"

        $LUAROCKS LuaFileSystem
        $LUAROCKS luautf8
        $LUAROCKS lpeg

        if [ "$RUNNER_OS" = "macOS" ]; then
          $LUAROCKS lua-zip ZIP_DIR=${HOMEBREW_PREFIX}/opt/libzip
          $LUAROCKS LuaSQL-SQLite3 2.6.1 SQLITE_DIR=${HOMEBREW_PREFIX}/opt/sqlite
          $LUAROCKS lrexlib-pcre2 PCRE2_DIR=${HOMEBREW_PREFIX}/opt/pcre2
        else
          $LUAROCKS lua-zip
          $LUAROCKS LuaSQL-SQLite3 2.6.1
          $LUAROCKS lrexlib-pcre2
        fi

        # CI changelog generation dependencies
        $LUAROCKS argparse
        $LUAROCKS lunajson

        # Lua-based tests
        $LUAROCKS busted

        # necessary for Qt multimedia and modern Qt
        # libfuse2 could be needed for linuxdeployqt on Ubuntu 22.04:
        if [ "${RUNNER_OS}" = "Linux" ]; then
          sudo apt-get install libgstreamer-plugins-base1.0-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 xvfb libfuse2 -y
        fi
      env:
        BUILD_FOLDER: ${{runner.workspace}}/b/ninja
        RUNNER_OS: ${{runner.os}}
        DEPLOY: ${{matrix.deploy}}

    - name: (Linux) Run C++ tests
      if: runner.os == 'Linux' && matrix.run_tests == 'true'
      working-directory: '${{runner.workspace}}/b/ninja'
      run: ctest --output-on-failure
      env:
        QT_QPA_PLATFORM: offscreen
        QT_FORCE_STDERR_LOGGING: 1

    - name: (macOS) Run C++ tests
      if: runner.os == 'macOS'
      working-directory: '${{runner.workspace}}/b/ninja'
      run: ctest --output-on-failure
      env:
        QT_FORCE_STDERR_LOGGING: 1

    # the full ctest run above already covers every functional-labelled test
    - name: Run QTest
      if: matrix.run_tests != 'true'
      run: ctest --test-dir ${{runner.workspace}}/b/ninja -L functional --output-on-failure
      env:
        QT_FORCE_STDERR_LOGGING: 1

    - name: add ssh-agent for release uploads
      if: (runner.os == 'Linux' || runner.os == 'macOS') && matrix.deploy == 'deploy' && startsWith(github.ref, 'refs/tags/Mudlet-')
      uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{secrets.UPLOAD_PRIVATEKEY}}

    - name: package Mudlet
      if: (runner.os == 'Linux' || runner.os == 'macOS') && matrix.deploy == 'deploy'
      run: |
        export ARCH=$(uname -m)
        echo "ARCH=$ARCH" >> $GITHUB_ENV
        if [ "$RUNNER_OS" = "macOS" ] && [ "$ARCH" = "arm64" ]; then
          # dblsqd only supports 'arm' as an architecture and not 'arm64'
          export ARCH_DBLSQD=arm
          echo "ARCH_DBLSQD=arm" >> $GITHUB_ENV
        else
          export ARCH_DBLSQD=$ARCH
          echo "ARCH_DBLSQD=$ARCH" >> $GITHUB_ENV
        fi
        ${{github.workspace}}/CI/after_success.sh
      env:
        BUILD_FOLDER: ${{runner.workspace}}/b/ninja
        RUNNER_OS: ${{runner.os}}
        X_WP_DOWNLOAD_TOKEN: ${{secrets.X_WP_DOWNLOAD_TOKEN}}
        DEPLOY: ${{matrix.deploy}}
        DEPLOY_PATH: ${{secrets.DEPLOY_PATH}}
        DBLSQD_USER: ${{secrets.DBLSQD_USER}}
        DBLSQD_PASS: ${{secrets.DBLSQD_PASS}}
        DEPLOY_KEY_PASS: ${{secrets.DEPLOY_KEY_PASS}}
        MACOS_SIGNING_PASS: ${{secrets.MACOS_SIGNING_PASS}}
        APPLE_USERNAME: ${{secrets.APPLE_USERNAME}}
        APPLE_PASSWORD: ${{secrets.APPLE_PASSWORD}}
        APPLE_TEAM_ID: ${{secrets.APPLE_TEAM_ID}}
        WITH_SENTRY: "ON"
        GITHUB_FORCE_BUILD: ${{ github.event.inputs.scheduled == 'true' }}
        # needed so CI/*.after_success.sh can query existing releases to skip duplicate PTBs
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload packaged Mudlet
      uses: actions/upload-artifact@v7
      if: env.UPLOAD_FILENAME
      with:
        name: ${{env.UPLOAD_FILENAME}}
        path: ${{env.FOLDER_TO_UPLOAD}}

    - name: Submit to make.mudlet.org
      if: env.UPLOAD_FILENAME
      run: curl --retry 5 -X POST "https://make.mudlet.org/snapshots/gha_queue.php?artifact_name=${{env.UPLOAD_FILENAME}}&unzip=1"
      shell: bash

    - name: Upload release asset for GitHub Release
      uses: actions/upload-artifact@v7
      if: env.RELEASE_ASSET_PATH
      with:
        name: release-asset-${{ runner.os }}-${{ runner.arch }}
        path: |
          ${{ env.RELEASE_ASSET_PATH }}
          ${{ env.RELEASE_ASSET_SHA256_PATH }}
        retention-days: 3

    - name: Export release metadata
      if: env.RELEASE_ASSET_PATH
      shell: bash
      run: |
        jq -n \
          --arg version "${VERSION}" \
          --arg build_suffix "${MUDLET_VERSION_BUILD}" \
          --arg commit "${BUILD_COMMIT}" \
          --arg ref "${{ github.ref }}" \
          --arg event "${{ github.event_name }}" \
          '{version: $version, build_suffix: $build_suffix, commit: $commit, ref: $ref, event: $event}' \
          > release-metadata.json

    - name: Upload release metadata
      uses: actions/upload-artifact@v7
      if: env.RELEASE_ASSET_PATH
      with:
        name: release-metadata-${{ runner.os }}-${{ runner.arch }}
        path: release-metadata.json
        retention-days: 3

    # we need to be in the right place for LuaGlobals.lua to load
    - name: (Linux) Prep binary for running tests
      if: matrix.run_tests == 'true' && runner.os =='Linux'
      run: cp ${{runner.workspace}}/b/ninja/src/mudlet ${{github.workspace}}/src

    - name: (macOS) Prep binary for running tests
      if: matrix.run_tests == 'true' && runner.os == 'macOS'
      run: |
        if [ -d "${{runner.workspace}}/b/ninja/${{env.UPLOAD_FILENAME}}.app" ]; then
          cp -r ${{runner.workspace}}/b/ninja/${{env.UPLOAD_FILENAME}}.app ~/Desktop/Mudlet.app
        elif [ -d "${{runner.workspace}}/b/ninja/Mudlet PTB.app" ]; then
          cp -r "${{runner.workspace}}/b/ninja/Mudlet PTB.app" ~/Desktop/Mudlet.app
        else
          cp -r ${{runner.workspace}}/b/ninja/src/mudlet.app ~/Desktop/Mudlet.app
        fi
        cd ~/Desktop
        sudo codesign --remove-signature ~/Desktop/Mudlet.app

    - name: (Linux/macOS) Start fixture HTTP server for Lua tests
      if: matrix.run_tests == 'true'
      shell: bash
      run: |
        port_file="${{runner.temp}}/mudlet-http-fixture-port"
        rm -f "${port_file}"
        MUDLET_TEST_HTTP_PORT_FILE="${port_file}" nohup python3 "${{github.workspace}}/CI/http-fixture-server.py" > "${{runner.temp}}/http-fixture-server.log" 2>&1 &
        for _ in $(seq 1 50); do
          [ -s "${port_file}" ] && break
          sleep 0.1
        done
        if [ ! -s "${port_file}" ]; then
          echo "fixture HTTP server failed to start" >&2
          cat "${{runner.temp}}/http-fixture-server.log" 2>/dev/null || true
          exit 1
        fi
        port="$(cat "${port_file}")"
        if ! curl -fsS "http://127.0.0.1:${port}/fixture.txt" > /dev/null; then
          echo "fixture HTTP server is not serving fixtures" >&2
          cat "${{runner.temp}}/http-fixture-server.log" 2>/dev/null || true
          exit 1
        fi
        echo "MUDLET_TEST_HTTP_PORT=${port}" >> "${GITHUB_ENV}"
        echo "fixture HTTP server ready on 127.0.0.1:${port}"

    - name: (Linux) Start fake Discord IPC server for Lua tests
      if: matrix.run_tests == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        # A short runtime directory of its own: the whole discord-ipc-0 socket
        # path has to fit into sockaddr_un's 108 character sun_path, and
        # runner.temp does not leave room for it.
        runtime_dir="$(mktemp -d /tmp/mdxdg-XXXX)"
        ready_file="${{runner.temp}}/mudlet-discord-fixture-ready"
        rm -f "${ready_file}"
        nohup python3 "${{github.workspace}}/CI/discord-ipc-fixture.py" \
          --runtime-dir "${runtime_dir}" \
          --capture-file "${{runner.temp}}/mudlet-discord-frames.jsonl" \
          --ready-file "${ready_file}" > "${{runner.temp}}/discord-ipc-fixture.log" 2>&1 &
        for _ in $(seq 1 50); do
          [ -s "${ready_file}" ] && break
          sleep 0.1
        done
        if [ ! -s "${ready_file}" ] || [ ! -S "${runtime_dir}/discord-ipc-0" ]; then
          echo "fake Discord IPC server failed to start" >&2
          cat "${{runner.temp}}/discord-ipc-fixture.log" 2>/dev/null || true
          exit 1
        fi
        cat "${ready_file}" >> "${GITHUB_ENV}"
        # Prepended rather than replacing: the Qt install action puts Qt's own
        # libraries on this path.
        echo "MUDLET_TEST_DISCORD_LIB_PATH=${{github.workspace}}/3rdparty/discord/rpc/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >> "${GITHUB_ENV}"
        echo "fake Discord IPC server ready in ${runtime_dir}"

    - name: (Linux/macOS) Start MMCP peer fixture for Lua tests
      if: matrix.run_tests == 'true'
      shell: bash
      run: |
        peer_dir="${{runner.temp}}/mudlet-mmcp-peer"
        rm -rf "${peer_dir}"
        mkdir -p "${peer_dir}"
        MUDLET_TEST_MMCP_DIR="${peer_dir}" nohup python3 "${{github.workspace}}/CI/mmcp-peer.py" > "${{runner.temp}}/mmcp-peer.log" 2>&1 &
        for _ in $(seq 1 50); do
          [ -s "${peer_dir}/port" ] && break
          sleep 0.1
        done
        if [ ! -s "${peer_dir}/port" ]; then
          echo "MMCP peer fixture failed to start" >&2
          cat "${{runner.temp}}/mmcp-peer.log" 2>/dev/null || true
          exit 1
        fi
        port="$(cat "${peer_dir}/port")"
        if ! python3 -c "import socket, sys; socket.create_connection(('127.0.0.1', int(sys.argv[1])), 5).close()" "${port}"; then
          echo "MMCP peer fixture is not accepting connections" >&2
          cat "${{runner.temp}}/mmcp-peer.log" 2>/dev/null || true
          exit 1
        fi
        echo "MUDLET_TEST_MMCP_DIR=${peer_dir}" >> "${GITHUB_ENV}"
        echo "MMCP peer fixture ready on 127.0.0.1:$(cat "${peer_dir}/port")"

    - name: (Linux) Run Lua tests
      if: matrix.run_tests == 'true' && runner.os == 'Linux'
      # Longer than the other platforms': this leg also drives the real
      # discord-rpc library, whose reconnects happen in wall-clock time.
      timeout-minutes: 3
      run: xvfb-run --auto-servernum ${{github.workspace}}/src/mudlet --profile "Mudlet self-test" --mirror
      env:
        AUTORUN_BUSTED_TESTS: 'true'
        MUDLET_TEST_MODE: 1
        MUDLET_TEST_REQUIRE_TTS_MOCK: 1
        MUDLET_TEST_REQUIRE_HTTP_FIXTURE: 1
        MUDLET_TEST_REQUIRE_MMCP_PEER: 1
        # Qt Multimedia runs a player here even without an audio device, so a
        # media effect spec that cannot play is a regression rather than an
        # environment quirk. macOS runners start no player at all, so the gate
        # stays off there.
        MUDLET_TEST_REQUIRE_MEDIA: 1
        # The fake Discord IPC server's socket lives in this runtime directory,
        # and the bundled discord-rpc library is only reachable through this
        # library path - without both the Discord specs have nothing to talk to.
        MUDLET_TEST_REQUIRE_DISCORD: 1
        XDG_RUNTIME_DIR: ${{env.MUDLET_TEST_DISCORD_RUNTIME_DIR}}
        LD_LIBRARY_PATH: ${{env.MUDLET_TEST_DISCORD_LIB_PATH}}
        # The session bus socket lives in the runtime directory replaced above,
        # so Qt's D-Bus platform theme can no longer find it and would fall back
        # to spawning dbus-launch. Point it at nothing instead: libdbus leaks
        # the buffer it reads the autolaunch reply into (1032 bytes, reported
        # against this job by LeakSanitizer with no Mudlet frames in the stack),
        # and no spec needs a session bus.
        DBUS_SESSION_BUS_ADDRESS: 'disabled:'
        TESTS_DIRECTORY: ${{github.workspace}}/src/mudlet-lua/tests
        QUIT_MUDLET_AFTER_TESTS: 'true'
        ASAN_OPTIONS: ${{ matrix.enable_asan == 'true' && 'detect_leaks=1' || '' }}
        LSAN_OPTIONS: ${{ matrix.enable_asan == 'true' && format('suppressions={0}/asan-suppressions.txt:exitcode=1', github.workspace) || '' }}

    - name: (macOS) Run Lua tests
      if: matrix.run_tests == 'true' && runner.os == 'macOS'
      timeout-minutes: 1
      run: ~/Desktop/Mudlet.app/Contents/MacOS/mudlet --profile "Mudlet self-test" --mirror
      env:
        AUTORUN_BUSTED_TESTS: 'true'
        MUDLET_TEST_MODE: 1
        MUDLET_TEST_REQUIRE_TTS_MOCK: 1
        MUDLET_TEST_REQUIRE_HTTP_FIXTURE: 1
        MUDLET_TEST_REQUIRE_MMCP_PEER: 1
        # No MUDLET_TEST_REQUIRE_MEDIA: Qt Multimedia starts no player on the
        # macOS runners, so the media effect specs pend here by design.
        TESTS_DIRECTORY: ${{github.workspace}}/src/mudlet-lua/tests
        QUIT_MUDLET_AFTER_TESTS: 'true'
        ASAN_OPTIONS: detect_leaks=0

    - name: (Linux) Show the captured Discord frames on failure
      if: failure() && matrix.run_tests == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        echo "--- fake Discord IPC server log ---"
        cat "${{runner.temp}}/discord-ipc-fixture.log" 2>/dev/null || true
        echo "--- frames it captured ---"
        cat "${{runner.temp}}/mudlet-discord-frames.jsonl" 2>/dev/null || true

    - name: Passed Lua tests
      if: matrix.run_tests == 'true'
      run: |
        if [ -e /tmp/busted-tests-failed ]
        then
          echo "Lua tests failed - see the action called 'Run Lua tests' above for detailed output."
          exit 1
        fi

  # Debugging harness for issue #9670, "Mudlet stops responding on macOS part way
  # through the package specs, after a burst of profile saves".
  #
  # This fixes nothing. It exists to get evidence off a macOS runner, because the
  # hang has only ever happened there and nobody working on it has a Mac.
  #
  # It lives in this file rather than in one of its own because GitHub only
  # offers workflow_dispatch for workflows that are already on the default
  # branch: a brand new dispatch-only file could not be tried out until after it
  # was merged, whereas a dispatch of this one runs the copy of it on whichever
  # branch is dispatched. compile-mudlet skips itself when this job is asked
  # for, so a debugging dispatch neither builds the other four legs nor packages,
  # notarises or submits anything.
  #
  # Two layers, because the hang does not schedule itself around office hours:
  #   1. CI/macos-hang-watchdog.sh wraps the Lua test run and, when the run goes
  #      quiet or outstays its budget, captures full thread backtraces of the
  #      process before killing it. This works with nobody watching.
  #   2. An optional detached tmate session, started just before the test step, so
  #      that someone who *is* watching can attach while the process is still hung.
  #
  # The build steps below are compile-mudlet's macOS ones minus everything to do
  # with packaging, so that the binary under test matches the one that hangs. If
  # that leg's dependencies change, this job has to be brought along by hand.
  debug-macos-hang:
    name: '#9670: ${{matrix.os}} / package-spec hang'
    runs-on: ${{matrix.os}}
    if: ${{ github.repository_owner == 'Mudlet' && inputs.debug_macos_hang }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.debug_runner == 'both' && '["macos-14", "macos-15-intel"]' || format('["{0}"]', inputs.debug_runner)) }}
    env:
      LUA_VERSION: '5.1.5'
      QT_VERSION: '6.9.0'
      # The watchdog's own triggers. The whole Lua suite takes about 14 seconds
      # on this runner, and the reported hang is total silence for ~54 seconds,
      # so 30 seconds of nothing is already well past normal.
      WATCHDOG_STALL_SECONDS: '30'
      # Has to stay comfortably under the test step's timeout-minutes below,
      # because capturing three sets of stacks after the budget expires takes
      # time of its own and the watchdog must not be killed mid-capture.
      WATCHDOG_MAX_SECONDS: '240'

    steps:
    - name: Checkout Mudlet source code
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{env.QT_VERSION}}
        dir: ${{runner.workspace}}
        cache: true
        modules: qt5compat qtmultimedia qtspeech

    - name: Use CMake 3.30.3
      uses: lukka/get-cmake@v4.4.0

    - name: Install Lua via GitHub Actions
      uses: leafo/gh-actions-lua@v13
      with:
        luaVersion: ${{env.LUA_VERSION}}
        buildCache: false

    - name: Install Luarocks via GitHub Actions
      uses: leafo/gh-actions-luarocks@v6

    - name: Install dependencies
      env:
        HOMEBREW_NO_ANALYTICS: "ON"
        HOMEBREW_NO_AUTO_UPDATE: "ON"
        HOMEBREW_NO_BOTTLE_SOURCE_FALLBACK: "ON"
        HOMEBREW_NO_INSTALL_CLEANUP: "ON"
      timeout-minutes: 7
      run: |
        # Remove Homebrew LLVM to prevent it from shadowing AppleClang.
        # Upstream LLVM can't compile Objective-C++ against Apple SDK headers.
        brew uninstall --ignore-dependencies llvm@15 2>/dev/null || true

        # brew install can hang indefinitely during bottle pouring, so timeout and retry
        for attempt in 1 2 3; do
          brew install libzzip libzip ccache expect assimp hunspell oniguruma pcre2 pugixml sqlite yajl boost &
          brew_pid=$!
          ( sleep 120 && kill $brew_pid 2>/dev/null ) &
          watcher_pid=$!
          wait $brew_pid && { kill $watcher_pid 2>/dev/null || true; wait $watcher_pid 2>/dev/null || true; break; }
          kill $watcher_pid 2>/dev/null || true; wait $watcher_pid 2>/dev/null || true
          echo "::warning::brew install attempt $attempt failed or timed out, retrying..."
          if [ "$attempt" -eq 3 ]; then
            echo "::error::brew install failed after 3 attempts"
            exit 1
          fi
        done

        if [ "$(uname -m)" = "arm64" ]; then
          HOMEBREW_PREFIX=/opt/homebrew
        else
          HOMEBREW_PREFIX=/usr/local
        fi

        luarocks --lua-version 5.1 install --local lua-yajl "YAJL_DIR=${HOMEBREW_PREFIX}/opt/yajl"
        eval "$(luarocks path --local --lua-version "5.1")"

        {
          echo "CCACHE_DIR=${{runner.workspace}}/ccache"
          echo "DEVELOPER_DIR=$(xcode-select --print-path)"
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)"
          echo "HOMEBREW_PREFIX=${HOMEBREW_PREFIX}"
          echo "CMAKE_PREFIX_PATH=${QT_ROOT_DIR}:${HOMEBREW_PREFIX}"
          echo "LUA_DIR=${HOME}/.lua"
          echo "PKG_CONFIG_PATH=${HOMEBREW_PREFIX}/opt/pcre2/lib/pkgconfig:${PKG_CONFIG_PATH-}"
          echo "LUA_PATH=${LUA_PATH}"
          echo "LUA_CPATH=${LUA_CPATH}"
        } >> "$GITHUB_ENV"

    # The same key build-mudlet.yml's macOS legs use, so a dispatch starts from
    # development's warm cache instead of compiling Mudlet from scratch.
    - name: Restore ccache
      id: restore-ccache
      uses: actions/cache/restore@v6
      with:
        path: ${{runner.workspace}}/ccache
        key: ccache-${{matrix.os}}-${{runner.arch}}-clang_64-${{env.QT_VERSION}}-${{github.ref_name}}
        restore-keys: ccache-${{matrix.os}}-${{runner.arch}}-clang_64-${{env.QT_VERSION}}-development

    - name: Set build info
      run: |
        "${{github.workspace}}/CI/validate_deployment.sh"
        "${{github.workspace}}/CI/set-build-info.sh"
        # ccache can't reliably detect that the compiler is clang on macOS, so just say so explicitly.
        {
          echo "CXX=clang++"
          echo "CC=clang"
        } >> "$GITHUB_ENV"

    - name: Get sentry-native commit hash
      id: sentry-hash
      run: echo "SENTRY_HASH=$(git -C 3rdparty/sentry-native rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Cache sentry-native
      uses: actions/cache@v6
      with:
        path: |
          3rdparty/sentry-native/install_without_transport
          3rdparty/sentry-native/install_with_transport
        key: sentry-${{runner.os}}-${{runner.arch}}-${{steps.sentry-hash.outputs.SENTRY_HASH}}

    - name: Build Mudlet
      uses: lukka/run-cmake@v3
      with:
        cmakeListsOrSettingsJson: CMakeListsTxtAdvanced
        cmakeListsTxtPath: '${{github.workspace}}/CMakeLists.txt'
        buildDirectory: '${{runner.workspace}}/b/ninja'
        cmakeAppendedArgs: >-
          -G Ninja
          -DCMAKE_PREFIX_PATH=${{env.CMAKE_PREFIX_PATH}}
          -DLUA_INCLUDE_DIR=${{github.workspace}}/.lua/include
          -DLUA_LIBRARY=${{github.workspace}}/.lua/lib/liblua.a
          -DWITH_SENTRY=ON
          -DSENTRY_SEND_DEBUG=0
          -DSENTRY_DSN=${{secrets.SENTRY_DSN}}
      env:
        NINJA_STATUS: '[%f/%t %o/sec] '
        SENTRY_AUTH_TOKEN: ${{secrets.SENTRY_AUTH_TOKEN}}

    - name: Save ccache
      if: always()
      uses: actions/cache/save@v6
      with:
        path: ${{runner.workspace}}/ccache
        key: ${{steps.restore-ccache.outputs.cache-primary-key}}

    - name: Install test dependencies
      run: |
        LUAROCKS="luarocks --lua-version 5.1 install --local"

        $LUAROCKS LuaFileSystem
        $LUAROCKS luautf8
        $LUAROCKS lpeg
        $LUAROCKS lua-zip "ZIP_DIR=${HOMEBREW_PREFIX}/opt/libzip"
        $LUAROCKS LuaSQL-SQLite3 2.6.1 "SQLITE_DIR=${HOMEBREW_PREFIX}/opt/sqlite"
        $LUAROCKS lrexlib-pcre2 "PCRE2_DIR=${HOMEBREW_PREFIX}/opt/pcre2"
        $LUAROCKS busted

    # Same placement and unsigning as the real leg: LuaGlobals.lua has to be
    # findable, and an unsigned binary is one the debugger can attach to.
    - name: Prep binary for running tests
      run: |
        cp -r "${{runner.workspace}}/b/ninja/src/mudlet.app" ~/Desktop/Mudlet.app
        # This build was never packaged, so unlike the real CI leg it may carry
        # no signature to remove - which is the state the command is trying to
        # reach anyway, so not having to do it is not a failure.
        sudo codesign --remove-signature ~/Desktop/Mudlet.app || echo "nothing to unsign"
        if [ ! -x ~/Desktop/Mudlet.app/Contents/MacOS/mudlet ]; then
          echo "::error::the build produced no runnable Mudlet binary, so there is nothing to watch"
          exit 1
        fi

    - name: Start fixture HTTP server for Lua tests
      shell: bash
      run: |
        port_file="${{runner.temp}}/mudlet-http-fixture-port"
        rm -f "${port_file}"
        MUDLET_TEST_HTTP_PORT_FILE="${port_file}" nohup python3 "${{github.workspace}}/CI/http-fixture-server.py" > "${{runner.temp}}/http-fixture-server.log" 2>&1 &
        for _ in $(seq 1 50); do
          [ -s "${port_file}" ] && break
          sleep 0.1
        done
        if [ ! -s "${port_file}" ]; then
          echo "fixture HTTP server failed to start" >&2
          cat "${{runner.temp}}/http-fixture-server.log" 2>/dev/null || true
          exit 1
        fi
        port="$(cat "${port_file}")"
        if ! curl -fsS "http://127.0.0.1:${port}/fixture.txt" > /dev/null; then
          echo "fixture HTTP server is not serving fixtures" >&2
          cat "${{runner.temp}}/http-fixture-server.log" 2>/dev/null || true
          exit 1
        fi
        echo "MUDLET_TEST_HTTP_PORT=${port}" >> "${GITHUB_ENV}"
        echo "fixture HTTP server ready on 127.0.0.1:${port}"

    - name: Start MMCP peer fixture for Lua tests
      shell: bash
      run: |
        peer_dir="${{runner.temp}}/mudlet-mmcp-peer"
        rm -rf "${peer_dir}"
        mkdir -p "${peer_dir}"
        MUDLET_TEST_MMCP_DIR="${peer_dir}" nohup python3 "${{github.workspace}}/CI/mmcp-peer.py" > "${{runner.temp}}/mmcp-peer.log" 2>&1 &
        for _ in $(seq 1 50); do
          [ -s "${peer_dir}/port" ] && break
          sleep 0.1
        done
        if [ ! -s "${peer_dir}/port" ]; then
          echo "MMCP peer fixture failed to start" >&2
          cat "${{runner.temp}}/mmcp-peer.log" 2>/dev/null || true
          exit 1
        fi
        port="$(cat "${peer_dir}/port")"
        if ! python3 -c "import socket, sys; socket.create_connection(('127.0.0.1', int(sys.argv[1])), 5).close()" "${port}"; then
          echo "MMCP peer fixture is not accepting connections" >&2
          cat "${{runner.temp}}/mmcp-peer.log" 2>/dev/null || true
          exit 1
        fi
        echo "MUDLET_TEST_MMCP_DIR=${peer_dir}" >> "${GITHUB_ENV}"
        echo "MMCP peer fixture ready on 127.0.0.1:${port}"

    # Started before the tests and detached, so that a session is already up
    # while the process is hung rather than after the watchdog has killed it.
    # limit-access-to-actor is not optional - Mudlet is a public repository, and
    # an unrestricted session would let anyone attach to a live runner. It
    # authorises the dispatcher's GitHub SSH keys and nobody else, so a
    # dispatcher with no keys on their account simply gets a session nobody can
    # connect to.
    - name: Start a detached tmate session
      if: ${{ inputs.debug_tmate }}
      uses: mxschmitt/action-tmate@v3
      with:
        limit-access-to-actor: true
        detached: true

    # 45 minutes covers the 240 second budget, the three capture tools after it
    # and the longest hold on offer, with room to spare. It has to: if the step
    # cap fires first the watchdog is killed before it writes anything, which is
    # exactly the outcome this harness exists to avoid (it reports that as exit
    # 92 rather than pretending it captured something).
    - name: Run Lua tests under the hang watchdog
      id: lua-tests
      timeout-minutes: 45
      shell: bash
      run: |
        rm -f /tmp/busted-tests-failed
        "${{github.workspace}}/CI/macos-hang-watchdog.sh" \
          --capture-dir "${{runner.temp}}/mudlet-hang-capture" \
          --stall-seconds "${WATCHDOG_STALL_SECONDS}" \
          --max-seconds "${WATCHDOG_MAX_SECONDS}" \
          --hold-seconds "$(( HOLD_MINUTES * 60 ))" \
          -- ~/Desktop/Mudlet.app/Contents/MacOS/mudlet --profile "Mudlet self-test" --mirror
      env:
        HOLD_MINUTES: ${{inputs.debug_hold_minutes}}
        AUTORUN_BUSTED_TESTS: 'true'
        MUDLET_TEST_MODE: 1
        MUDLET_TEST_REQUIRE_TTS_MOCK: 1
        MUDLET_TEST_REQUIRE_HTTP_FIXTURE: 1
        MUDLET_TEST_REQUIRE_MMCP_PEER: 1
        # The whole point of the dispatch: without this the package specs that
        # install something stay pending on macOS and the hang cannot happen.
        MUDLET_TEST_FORCE_PACKAGE_INSTALLS: ${{ inputs.debug_macos_hang && '1' || '' }}
        TESTS_DIRECTORY: ${{github.workspace}}/src/mudlet-lua/tests
        QUIT_MUDLET_AFTER_TESTS: 'true'
        ASAN_OPTIONS: detect_leaks=0

    - name: Summarise what the watchdog caught
      if: always()
      shell: bash
      env:
        FORCED_INSTALLS: ${{inputs.debug_macos_hang}}
      run: |
        capture_dir="${{runner.temp}}/mudlet-hang-capture"
        {
          echo "## ${{matrix.os}}"
          echo
          echo "Package installs forced: \`${FORCED_INSTALLS}\`"
          echo
          if [ -f "${capture_dir}/outcome.txt" ]; then
            echo '```'
            cat "${capture_dir}/outcome.txt"
            echo '```'
          else
            echo "The watchdog wrote no outcome file - it did not get as far as running the tests."
          fi
          if [ -f "${capture_dir}/capture-failures.txt" ]; then
            echo
            echo "Capture problems:"
            echo '```'
            cat "${capture_dir}/capture-failures.txt"
            echo '```'
          fi
          if [ -e /tmp/busted-tests-failed ]; then
            echo
            echo "busted also reported at least one failing spec."
          fi
        } >> "${GITHUB_STEP_SUMMARY}"

    # if-no-files-found: error on purpose - a harness that quietly uploads
    # nothing is worse than no harness, because the empty artifact reads as a
    # clean run. Only skipped when the tests never started, so that a build
    # failure is not reported as a capture failure.
    - name: Upload the hang capture
      if: ${{ always() && steps.lua-tests.conclusion != 'skipped' }}
      uses: actions/upload-artifact@v7
      with:
        name: hang-capture-${{matrix.os}}
        path: ${{runner.temp}}/mudlet-hang-capture
        if-no-files-found: error
        retention-days: 14

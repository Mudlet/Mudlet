# Android and iOS builds of mudlet_core have to leave out spawn(), Discord, the
# Vosk and sherpa-onnx engines, the MCP server, the updater, the 3D mapper and
# Sentry (#9011), and link in the Lua C modules they cannot dlopen. Nothing else
# builds that way, so this does, to keep those options from rotting. See
# "Leaving out what a mobile build cannot use" and "Lua C modules without
# dlopen" in docs/platform-builds.md.
name: Build mudlet_core without its desktop-only parts

on:
  push:
    branches: [development]
  pull_request:
    paths:
      - 'src/**'
      - '3rdparty/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/core-mobile-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-minimal:
    name: Build mudlet-headless with the mobile options off
    runs-on: ubuntu-22.04
    if: ${{ github.repository_owner == 'Mudlet' }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.3'
          dir: ${{ runner.workspace }}
          cache: false
          modules: qt5compat qtmultimedia qtspeech

      - name: Install dependencies
        # lua5.1 writes the translation statistics that mudlet.qrc embeds
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++-12 \
            libboost-dev \
            libglu1-mesa-dev \
            libhunspell-dev \
            libpcre2-dev \
            libpugixml-dev \
            libpulse-dev \
            libsqlite3-dev \
            libyajl-dev \
            libzip-dev \
            lua5.1 \
            ninja-build \
            qtkeychain-qt6-dev \
            zlib1g-dev
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 12
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 12

      - name: Configure
        run: cmake --preset linux-core-minimal

      - name: Build
        run: cmake --build --preset linux-core-minimal

      - name: Check mudlet_core uses none of what was left out
        # Undefined symbols are what the library calls into, so this cannot be
        # fooled by code that only sits behind an #if. nm runs on its own so that
        # an archive it cannot read fails the step instead of matching nothing.
        run: |
          nm -C --undefined-only build-linux-core-minimal/src/libmudlet_core.a > "$RUNNER_TEMP/core-undefined.txt"
          if grep -E 'QProcess::|QLibrary::|QLocalServer::|QLocalSocket::|QHttpServer|sentry_' "$RUNNER_TEMP/core-undefined.txt"; then
            echo "::error::mudlet_core still uses one of the above with the mobile options off"
            exit 1
          fi

      - name: Run mudlet-headless
        run: build-linux-core-minimal/src/mudlet-headless --version

      - name: Install Lua and Luarocks
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: '5.1.5'
          buildCache: false

      - uses: leafo/gh-actions-luarocks@v6

      # busted alone: every module mudlet-lua requires has to come from package.preload
      - name: Install busted
        run: |
          luarocks --lua-version 5.1 install --local busted
          eval "$(luarocks path --local --lua-version 5.1)"
          echo "LUA_PATH=$LUA_PATH" >> $GITHUB_ENV
          echo "LUA_CPATH=$LUA_CPATH" >> $GITHUB_ENV

      # busted not loading at all writes no failure marker, so the summary has to be there too.
      # DB_spec.lua is there for the luasql.sqlite3 behaviour DB.lua depends on.
      - name: Check the Lua C modules load with no dlopen
        timeout-minutes: 5
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/static-lua-modules.log"
          mkdir -p "$XDG_CONFIG_HOME/mudlet/profiles" "$TESTS_DIRECTORY"
          cp src/mudlet-lua/tests/StaticLuaModules_spec.lua src/mudlet-lua/tests/DB_spec.lua "$TESTS_DIRECTORY"
          build-linux-core-minimal/src/mudlet-headless -p "Mudlet self-test" --host mudlet.org --port 23 --offline --no-stdin \
            2>&1 | tee "$log"
          if [ -e "$MUDLET_TEST_FAILURE_MARKER" ]; then
            echo "::error::StaticLuaModules_spec.lua or DB_spec.lua failed"
            exit 1
          fi
          if grep -F '[ ERROR ] - Cannot find Lua module' "$log"; then
            echo "::error::mudlet-headless could not load a Lua C module it requires at startup"
            exit 1
          fi
          grep -Eq '^[1-9][0-9]* successes / 0 failures / 0 errors / 0 pending' "$log"
        env:
          AUTORUN_BUSTED_TESTS: 'true'
          QUIT_MUDLET_AFTER_TESTS: 'true'
          TESTS_DIRECTORY: ${{ runner.temp }}/static-lua-module-specs
          MUDLET_EXPECT_STATIC_LUA_MODULES: '1'
          MUDLET_TEST_MODE: 1
          MUDLET_TEST_FAILURE_MARKER: ${{ runner.temp }}/static-lua-modules-failed
          HOME: ${{ runner.temp }}/headless-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/headless-home/.config
          QT_QPA_PLATFORM: offscreen
          DBUS_SESSION_BUS_ADDRESS: 'disabled:'

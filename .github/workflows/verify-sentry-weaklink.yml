# Temporary verification workflow for PR #9945 — delete after review.
#
# Empirically verifies, on a real macOS runner, what deployment target and
# import linkage the sentry-native sub-build actually gets:
#   leg 1 ("fixed"):   WithSentry.cmake from this branch  -> MUST produce
#                      weak os_sync_* imports and LC_BUILD_VERSION minos 12.0
#   leg 2 ("control"): WithSentry.cmake from development  -> diagnostic only:
#                      measures the un-forwarded default (varies by toolchain;
#                      whichever builder defaults to >= 14.4 ships the crash)
name: Verify sentry weak-linking (PR 9945)

on:
  push:
    branches:
      - claude/verify-9945-macos-weaklink

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.0'
          dir: ${{ runner.workspace }}
          cache: true
          modules: qt5compat qtmultimedia qtspeech

      - name: Install Lua
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: '5.1.5'
          buildCache: false

      - name: Install dependencies
        env:
          HOMEBREW_NO_ANALYTICS: "ON"
          HOMEBREW_NO_AUTO_UPDATE: "ON"
          HOMEBREW_NO_INSTALL_CLEANUP: "ON"
        timeout-minutes: 7
        run: |
          brew uninstall --ignore-dependencies llvm@15 2>/dev/null || true
          brew install libzzip libzip expect assimp hunspell oniguruma pcre2 pugixml sqlite yajl boost
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> $GITHUB_ENV
          if [ "$(uname -m)" = "arm64" ]; then HOMEBREW_PREFIX=/opt/homebrew; else HOMEBREW_PREFIX=/usr/local; fi
          echo "HOMEBREW_PREFIX=$HOMEBREW_PREFIX" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=${QT_ROOT_DIR}:${HOMEBREW_PREFIX}" >> $GITHUB_ENV
          sw_vers
          xcrun clang --version

      - name: 'Leg 1 (fixed): build sentry via WithSentry.cmake from this branch'
        run: |
          cmake -S . -B build-fixed -G Ninja \
            -DCMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH}" \
            -DLUA_INCLUDE_DIR="${GITHUB_WORKSPACE}/.lua/include" \
            -DLUA_LIBRARY="${GITHUB_WORKSPACE}/.lua/lib/liblua.a" \
            -DWITH_SENTRY=ON
          cmake --build build-fixed --target sentry_without_transport

      - name: 'Leg 1 (fixed): scan linkage and minos'
        run: |
          mkdir -p scan
          LIBS=$(find 3rdparty/sentry-native/install_without_transport -name '*.a')
          echo "libs found:"; echo "$LIBS"
          nm -m $LIBS 2>/dev/null | grep -i 'os_sync_' | sort -u | tee scan/fixed-linkage.txt
          for lib in $LIBS; do otool -l "$lib" 2>/dev/null; done \
            | grep -E '^\s+minos ' | sort | uniq -c | tee scan/fixed-minos.txt
          if [ ! -s scan/fixed-linkage.txt ]; then
            echo "::error::FIXED leg: no os_sync_* references found - scan is broken"; exit 1
          fi
          if grep -i 'os_sync_' scan/fixed-linkage.txt | grep -v -i 'weak'; then
            echo "::error::FIXED leg: STRONG os_sync_* import present - fix did not take effect"; exit 1
          fi
          if grep -qE 'minos\s+1[3-9]' scan/fixed-minos.txt; then
            echo "::error::FIXED leg: some objects have minos > 12 - deployment target not forwarded everywhere"; exit 1
          fi
          echo "FIXED leg OK: weak imports only, and all objects target macOS 12"

      - name: 'Leg 2 (control): revert WithSentry.cmake to development'
        run: |
          rm -rf 3rdparty/sentry-native/install_without_transport
          git fetch origin development --depth=1
          git checkout FETCH_HEAD -- src/cmake/WithSentry.cmake
          git diff --stat HEAD -- src/cmake/WithSentry.cmake

      - name: 'Leg 2 (control): build sentry via development WithSentry.cmake'
        run: |
          cmake -S . -B build-control -G Ninja \
            -DCMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH}" \
            -DLUA_INCLUDE_DIR="${GITHUB_WORKSPACE}/.lua/include" \
            -DLUA_LIBRARY="${GITHUB_WORKSPACE}/.lua/lib/liblua.a" \
            -DWITH_SENTRY=ON
          cmake --build build-control --target sentry_without_transport

      - name: 'Leg 2 (control): measure the un-forwarded default (diagnostic)'
        run: |
          LIBS=$(find 3rdparty/sentry-native/install_without_transport -name '*.a')
          nm -m $LIBS 2>/dev/null | grep -i 'os_sync_' | sort -u | tee scan/control-linkage.txt
          for lib in $LIBS; do otool -l "$lib" 2>/dev/null; done \
            | grep -E '^\s+minos ' | sort | uniq -c | tee scan/control-minos.txt
          echo "==================== REPORT ===================="
          echo "--- fixed linkage ---";   cat scan/fixed-linkage.txt
          echo "--- fixed minos ---";     cat scan/fixed-minos.txt
          echo "--- control linkage ---"; cat scan/control-linkage.txt
          echo "--- control minos ---";   cat scan/control-minos.txt
          if grep -i 'os_sync_' scan/control-linkage.txt | grep -q -v -i 'weak'; then
            echo "CONTROL: un-forwarded default on this toolchain is >= 14.4 -> STRONG imports (reproduces the shipping bug here)"
          else
            echo "CONTROL: un-forwarded default on this toolchain is < 14.4 -> weak imports; this runner/toolchain combo cannot reproduce the strong linkage (the >=14.4-defaulting builder is the one that shipped the bug). See control-minos for the measured default."
          fi

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: os-sync-linkage-scan
          path: scan/

      - name: Interactive debugging on failure
        if: failure()
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: false
        timeout-minutes: 20
